<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mcp:ui-size" content="minWidth=800;minHeight=400;maxHeight=900">
    <title>Spreadsheet</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Default: dark theme */
        :root {
            --primary: #2ea043;
            --primary-hover: #3fb950;
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --border: #30363d;
            --border-dark: #484f58;
            --text-primary: #c9d1d9;
            --text-secondary: #8b949e;
            --text-muted: #6e7681;
            --accent: #58a6ff;
            --error: #f85149;
            --formula-bar-bg: #161b22;
            --header-bg: #161b22;
            --grid-line: #30363d;
            --selection: #58a6ff;
            --selection-bg: rgba(88, 166, 255, 0.15);
            --cell-active: #0d1117;
            --cell-empty: rgba(255, 255, 255, 0.03);
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 3px 6px rgba(0, 0, 0, 0.4);
        }

        /* Light theme override via .light class on :root */
        :root.light {
            --primary: #217346;
            --primary-hover: #1e623c;
            --bg-primary: #ffffff;
            --bg-secondary: #f8f9fa;
            --bg-tertiary: #f3f2f1;
            --border: #e1e4e8;
            --border-dark: #d0d7de;
            --text-primary: #24292f;
            --text-secondary: #57606a;
            --text-muted: #8c959f;
            --accent: #0969da;
            --error: #cf222e;
            --formula-bar-bg: #f6f8fa;
            --header-bg: #f6f8fa;
            --grid-line: #d0d7de;
            --selection: #0969da;
            --selection-bg: rgba(9, 105, 218, 0.1);
            --cell-active: #ffffff;
            --cell-empty: rgba(0, 0, 0, 0.03);
            --shadow-sm: 0 1px 2px rgba(31, 35, 40, 0.04);
            --shadow-md: 0 3px 6px rgba(31, 35, 40, 0.08);
        }

        /* Slim scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--border-dark);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: background 0.2s, color 0.2s;
        }

        /* Toolbar */
        .toolbar {
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border);
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: var(--shadow-sm);
            z-index: 100;
        }

        .toolbar-section {
            display: flex;
            align-items: center;
            gap: 6px;
            padding-right: 12px;
            border-right: 1px solid var(--border);
        }

        .toolbar-section:last-child {
            border-right: none;
            padding-right: 0;
        }

        .btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.15s;
            color: var(--text-primary);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover {
            background: var(--bg-tertiary);
            border-color: var(--border-dark);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            border-color: var(--primary-hover);
        }

        .btn-icon {
            padding: 6px 8px;
            font-size: 14px;
        }

        .btn.active {
            background: var(--selection-bg);
            border-color: var(--selection);
            color: var(--selection);
        }

        /* Tabs */
        .tabs-container {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 12px;
            overflow-x: auto;
            gap: 2px;
            height: 32px;
        }

        .tab {
            padding: 6px 16px;
            font-size: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            border: 1px solid transparent;
            border-bottom: none;
            border-radius: 6px 6px 0 0;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.15s;
            background: transparent;
        }

        .tab:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .tab.active {
            background: var(--bg-primary);
            color: var(--accent);
            border-color: var(--border);
            font-weight: 600;
            position: relative;
        }

        .tab.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 1px;
            background: var(--bg-primary);
            z-index: 2;
        }

        .tab-close {
            opacity: 0;
            font-size: 14px;
            line-height: 1;
        }

        .tab:hover .tab-close {
            opacity: 0.6;
        }

        .tab-close:hover {
            opacity: 1;
            color: var(--error);
        }

        .btn-new-tab {
            padding: 4px 8px;
            font-size: 16px;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 4px;
        }

        .btn-new-tab:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        /* Sidebar table list */
        .table-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .table-item {
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--text-secondary);
        }

        .table-item:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .table-item.active {
            background: var(--selection-bg);
            color: var(--selection);
            font-weight: 500;
        }

        .table-info {
            font-size: 10px;
            opacity: 0.5;
        }

        /* Formula Bar */
        .formula-container {
            background: var(--formula-bar-bg);
            border-bottom: 1px solid var(--border);
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .cell-reference {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 6px 10px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            min-width: 80px;
            text-align: center;
            font-family: 'SF Mono', Monaco, monospace;
        }

        .formula-input-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 0 12px;
            transition: border-color 0.15s;
        }

        .formula-input-wrapper:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--selection-bg);
        }

        #formulaInput {
            flex: 1;
            border: none;
            outline: none;
            padding: 6px 0;
            font-size: 14px;
            font-family: 'SF Mono', Monaco, monospace;
            background: transparent;
            color: var(--text-primary);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            overflow: hidden;
            min-height: 0;
        }

        /* Sidebar for Views */
        .sidebar {
            width: 240px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            transition: width 0.2s;
        }

        .sidebar.collapsed {
            width: 0;
            overflow: hidden;
        }

        .sidebar-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .sidebar-section {
            padding: 12px;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-section-title {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        /* Sheet */
        .sheet-wrapper {
            position: relative;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .sheet-container {
            flex: 1;
            overflow: auto;
            position: relative;
            background: var(--bg-secondary);
        }

        /* Grid */
        .grid-wrapper {
            position: relative;
            min-width: fit-content;
            min-height: fit-content;
            background: var(--bg-primary);
        }

        table {
            border-collapse: separate;
            border-spacing: 0;
            font-size: 13px;
            table-layout: fixed;
        }

        th, td {
            border-right: 1px solid var(--grid-line);
            border-bottom: 1px solid var(--grid-line);
            padding: 0;
            position: relative;
        }

        th {
            background: var(--header-bg);
            font-weight: 600;
            color: var(--text-secondary);
            text-align: center;
            position: sticky;
            z-index: 10;
        }

        th.corner {
            position: sticky;
            top: 0;
            left: 0;
            z-index: 20;
            width: 50px;
            height: 25px;
            background: var(--header-bg);
            border-right: 1px solid var(--border-dark);
            border-bottom: 1px solid var(--border-dark);
        }

        th.col-header {
            top: 0;
            height: 25px;
            min-width: 100px;
            border-bottom: 1px solid var(--border-dark);
        }

        th.row-header {
            left: 0;
            width: 50px;
            height: 24px;
            border-right: 1px solid var(--border-dark);
        }

        td {
            background: var(--bg-primary);
            height: 24px;
            min-width: 100px;
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .cell-content {
            padding: 0 6px;
            height: 100%;
            display: flex;
            align-items: center;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-primary);
        }

        /* Status Bar */
        .status-bar {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            padding: 6px 16px;
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .context-menu {
            position: fixed;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: var(--shadow-md);
            z-index: 300;
            min-width: 180px;
            padding: 4px 0;
            display: none;
        }

        .context-menu.visible {
            display: block;
        }

        .context-menu-item {
            padding: 8px 16px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .context-menu-item:hover {
            background: var(--selection-bg);
        }

        .context-menu-sep {
            height: 1px;
            background: var(--border);
            margin: 4px 0;
        }

        /* ── File Picker Overlay ── */

        .picker-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 500;
        }

        .picker-overlay.visible { display: flex; }

        .picker {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            width: 480px;
            max-height: 70vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: picker-in 0.2s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes picker-in {
            from { opacity: 0; transform: scale(0.96) translateY(8px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .picker-header {
            padding: 20px 24px 16px;
            border-bottom: 1px solid var(--border);
        }

        .picker-header h2 {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 12px;
        }

        .picker-search {
            width: 100%;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
        }

        .picker-search:focus { border-color: var(--accent); }
        .picker-search::placeholder { color: var(--text-muted); }

        .picker-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .picker-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.12s;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            color: var(--text-primary);
            font-size: 13px;
        }

        .picker-item:hover { background: var(--selection-bg); }

        .picker-item .icon {
            width: 36px;
            height: 36px;
            background: rgba(88,166,255,0.1);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .picker-item .info { flex: 1; min-width: 0; }
        .picker-item .info .name { font-weight: 500; }
        .picker-item .info .meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

        .picker-footer {
            padding: 12px 16px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 8px;
        }

        .picker-footer input {
            flex: 1;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
        }

        .picker-footer input::placeholder { color: var(--text-muted); }

        /* Sidebar toggle */
        .sidebar-toggle {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-left: none;
            border-radius: 0 4px 4px 0;
            padding: 8px 4px;
            cursor: pointer;
            z-index: 50;
            font-size: 12px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <!-- File Picker Overlay -->
    <div class="picker-overlay" id="pickerOverlay">
        <div class="picker">
            <div class="picker-header">
                <h2>Open Spreadsheet</h2>
                <input class="picker-search" id="pickerSearch" placeholder="Search spreadsheets..." autocomplete="off">
            </div>
            <div class="picker-list" id="pickerList"></div>
            <div class="picker-footer">
                <input id="newFileName" placeholder="New spreadsheet name...">
                <button class="btn btn-primary" onclick="createFromPicker()">Create</button>
            </div>
        </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
        <div class="toolbar-section">
            <button class="btn" onclick="showFilePicker()" title="Browse spreadsheets">Files</button>
            <button class="btn btn-primary" onclick="spreadsheet.newFile()">
                <span>+</span> New
            </button>
            <button class="btn" onclick="spreadsheet.openImportModal()">
                Import CSV
            </button>
            <button class="btn" onclick="spreadsheet.exportCSV()">
                Export CSV
            </button>
        </div>
        <div class="toolbar-section">
            <button class="btn btn-icon" onclick="spreadsheet.addRow()" title="Add Row">Add Row</button>
            <button class="btn btn-icon" onclick="spreadsheet.addColumn()" title="Add Column">Add Col</button>
        </div>
        <div class="toolbar-section" style="border-right:none;margin-left:auto;">
            <input type="text" id="searchInput" placeholder="Search..." style="background:var(--bg-primary);border:1px solid var(--border);border-radius:4px;padding:6px 10px;font-size:12px;color:var(--text-primary);width:160px;outline:none;" autocomplete="off">
        </div>
    </div>

    <!-- Formula Bar -->
    <div class="formula-container">
        <div class="cell-reference" id="cellRef">A1</div>
        <div class="formula-input-wrapper">
            <input type="text" id="formulaInput" placeholder="Enter formula (start with =) or value..." autocomplete="off">
        </div>
    </div>

    <!-- Context Menu -->
    <div class="context-menu" id="contextMenu">
        <div class="context-menu-item" data-action="insert-row-above">Insert row above</div>
        <div class="context-menu-item" data-action="insert-row-below">Insert row below</div>
        <div class="context-menu-sep"></div>
        <div class="context-menu-item" data-action="insert-col-left">Insert column left</div>
        <div class="context-menu-item" data-action="insert-col-right">Insert column right</div>
        <div class="context-menu-sep"></div>
        <div class="context-menu-item" data-action="delete-row" style="color: var(--error)">Delete row</div>
        <div class="context-menu-item" data-action="delete-col" style="color: var(--error)">Delete column</div>
        <div class="context-menu-sep"></div>
        <div class="context-menu-item" data-action="fill">Fill range...</div>
        <div class="context-menu-item" data-action="clear">Clear cell</div>
        <div class="context-menu-sep"></div>
        <div class="context-menu-item" data-action="rename">Rename column</div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span class="sidebar-title">Workbook</span>
                <button class="btn-icon" onclick="spreadsheet.toggleSidebar()">←</button>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-section-title">Sheets</div>
                <div class="table-list" id="sheetList">
                    <div class="table-item active">
                        <span>📄 default.csv</span>
                    </div>
                </div>
                <button class="btn" style="width: 100%; margin-top: 8px; justify-content: center; font-size: 11px;" onclick="spreadsheet.newSheet()">
                    + New Sheet
                </button>
            </div>
            
            <div class="sidebar-section">
                <div class="sidebar-section-title">Views</div>
                <div class="view-list" id="viewList">
                    <div class="view-item active" onclick="spreadsheet.switchView('grid')">
                        <span>⊞</span> Grid view
                    </div>
                </div>
            </div>
        </div>

        <!-- Sheet Wrapper -->
        <div class="sheet-wrapper">
            <button class="sidebar-toggle" onclick="spreadsheet.toggleSidebar()" id="sidebarToggle">▶</button>
            
            <!-- Tabs Bar -->
            <div class="tabs-container" id="tabBar">
                <div class="tab active" onclick="spreadsheet.switchSheet('default')">
                    <span>default</span>
                </div>
                <div class="btn-new-tab" onclick="spreadsheet.newSheet()" title="New Sheet">+</div>
            </div>

            <div class="sheet-container" id="sheetContainer">
                <div class="grid-wrapper" id="gridWrapper">
                    <table id="spreadsheet">
                        <thead id="tableHead"></thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Status Bar -->
    <div class="status-bar">
        <div class="status-left">
            <span class="status-item" id="cellCount">Ready</span>
            <span class="status-item" id="recordCount"></span>
        </div>
        <div class="status-right">
            <span class="status-item">Spreadsheet</span>
        </div>
    </div>

    <script>
        // ── MCP Helpers ──

        function parseMCP(raw) {
            if (raw && raw.content && Array.isArray(raw.content)) {
                const item = raw.content.find(c => c.type === "text" && c.text);
                if (item) { try { return JSON.parse(item.text); } catch { return item.text; } }
            }
            return raw;
        }

        /** Convert col index (0-based) to letter(s): 0->A, 25->Z, 26->AA */
        function colToLetter(c) {
            let name = '';
            let num = c + 1;
            while (num > 0) {
                num--;
                name = String.fromCharCode(65 + (num % 26)) + name;
                num = Math.floor(num / 26);
            }
            return name;
        }

        /** Convert A1-style cell ref to {row, col} (0-based) */
        function cellRefToIndex(ref) {
            const m = ref.match(/^([A-Z]+)(\d+)$/i);
            if (!m) return null;
            let col = 0;
            for (const ch of m[1].toUpperCase()) {
                col = col * 26 + (ch.charCodeAt(0) - 64);
            }
            return { row: parseInt(m[2], 10) - 1, col: col - 1 };
        }

        /** Build cell ref from 0-based row/col */
        function indexToCellRef(row, col) {
            return colToLetter(col) + (row + 1);
        }

        // ── Spreadsheet Engine ──

        const app = window["spreadsheet"];

        class SpreadsheetEngine {
            constructor(rows = 20, cols = 10) {
                this.data = [];
                this.backendFormulas = {};   // { "A1": "=SUM(...)" } from backend
                this.headers = [];
                this.rowCount = rows;
                this.colCount = cols;
                this.selectedCell = { row: 0, col: 0 };
                this.editing = false;
                this.currentTable = 'default';
                this.tables = [];
                this.openTabs = ['default'];
                this.sidebarVisible = false;
                this.sortState = {};         // { column, direction }
                this.contextCell = null;     // { row, col } for context menu
                this.init();
            }

            init() {
                this.generateHeaders();
                this.initializeData();
                this.render();
                this.renderTabs();
                this.bindEvents();
                document.getElementById('sidebar')?.classList.add('collapsed');
            }

            generateHeaders() {
                this.headers = [];
                for (let i = 0; i < this.colCount; i++) {
                    this.headers.push(colToLetter(i));
                }
            }

            initializeData() {
                this.data = Array.from({length: this.rowCount}, () => new Array(this.colCount).fill(''));
            }

            /** Load backend snapshot data into the local grid */
            loadFromSnapshot(snap) {
                if (!snap) return;

                // Headers from backend (these are the real column names)
                if (snap.headers && snap.headers.length) {
                    this.headers = snap.headers;
                    this.colCount = snap.headers.length;
                }

                // Data rows
                if (snap.data) {
                    this.data = snap.data.map(row => [...row]);
                    this.rowCount = this.data.length;
                }

                // Pad grid to at least a minimal size for empty spreadsheets
                const minRows = 20, minCols = Math.max(this.colCount, 10);
                while (this.data.length < minRows) {
                    this.data.push(new Array(this.colCount).fill(''));
                    this.rowCount++;
                }

                // Formulas map
                this.backendFormulas = snap.formulas || {};

                // Rows/cols count from snapshot
                if (snap.rows != null) this.rowCount = Math.max(this.rowCount, snap.rows);
                if (snap.cols != null) this.colCount = Math.max(this.colCount, snap.cols);

                this.render();
                this.updateStatus(snap.message || `${this.rowCount} rows x ${this.colCount} cols`);
            }

            toggleSidebar() {
                this.sidebarVisible = !this.sidebarVisible;
                document.getElementById('sidebar').classList.toggle('collapsed', !this.sidebarVisible);
                document.getElementById('sidebarToggle').textContent = this.sidebarVisible ? '\u25C0' : '\u25B6';
            }

            newSheet() {
                const name = prompt('Enter sheet name:');
                if (!name) return;
                this.switchSheet(name);
            }

            async switchSheet(name) {
                this.currentTable = name;
                if (!this.openTabs.includes(name)) {
                    this.openTabs.push(name);
                }
                this.renderTabs();
                // Switch backend instance and reload
                if (window.photon?.switchInstance) {
                    await window.photon.switchInstance(name);
                }
                await loadDataFromPhoton();
            }

            closeTab(name, e) {
                if (e) e.stopPropagation();
                if (this.openTabs.length <= 1) return;
                this.openTabs = this.openTabs.filter(t => t !== name);
                if (this.currentTable === name) {
                    this.switchSheet(this.openTabs[0]);
                } else {
                    this.renderTabs();
                }
            }

            renderTabs() {
                const tabBar = document.getElementById('tabBar');
                if (!tabBar) return;
                let html = this.openTabs.map(tab => `
                    <div class="tab ${tab === this.currentTable ? 'active' : ''}" onclick="spreadsheet.switchSheet('${tab}')">
                        <span>${tab}</span>
                        <span class="tab-close" onclick="spreadsheet.closeTab('${tab}', event)">\u00d7</span>
                    </div>
                `).join('');
                html += '<div class="btn-new-tab" onclick="spreadsheet.newSheet()" title="New Sheet">+</div>';
                tabBar.innerHTML = html;
            }

            renderSheetList(tables) {
                this.tables = tables;
                const list = document.getElementById('sheetList');
                if (!list) return;
                list.innerHTML = tables.map(table => `
                    <div class="table-item ${table.name === this.currentTable ? 'active' : ''}" onclick="spreadsheet.switchSheet('${table.name}')">
                        <span>\uD83D\uDCC4 ${table.name}</span>
                        <span class="table-info">${(table.size / 1024).toFixed(1)} KB</span>
                    </div>
                `).join('');
            }

            render() {
                const thead = document.getElementById('tableHead');
                const tbody = document.getElementById('tableBody');

                // Column headers — clickable to sort
                thead.innerHTML = '<tr><th class="corner"></th>' +
                    this.headers.map((h, c) => {
                        const sortIcon = this.sortState.column === h
                            ? (this.sortState.direction === 'asc' ? ' \u25B2' : ' \u25BC') : '';
                        return `<th class="col-header" data-col="${c}" title="Click to sort">${h}${sortIcon}</th>`;
                    }).join('') + '</tr>';

                tbody.innerHTML = this.data.map((row, r) => `
                    <tr>
                        <th class="row-header">${r + 1}</th>
                        ${row.map((cell, c) => {
                            const isSelected = r === this.selectedCell.row && c === this.selectedCell.col;
                            const style = isSelected ? 'outline: 2px solid var(--selection); outline-offset: -1px; z-index: 5;' : '';
                            return `<td data-row="${r}" data-col="${c}" style="${style}">
                                <div class="cell-content">${this.escapeHtml(cell)}</div>
                            </td>`;
                        }).join('')}
                    </tr>
                `).join('');

                this.updateCellRef();
            }

            escapeHtml(str) {
                if (str == null) return '';
                return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
            }

            // ── Cell Selection & Editing ──

            bindEvents() {
                const container = document.getElementById('sheetContainer');

                // Cell click -> select
                container.addEventListener('click', (e) => {
                    const td = e.target.closest('td[data-row]');
                    if (!td) return;
                    const row = parseInt(td.dataset.row);
                    const col = parseInt(td.dataset.col);
                    this.selectCell(row, col);
                });

                // Cell double-click -> edit
                container.addEventListener('dblclick', (e) => {
                    const td = e.target.closest('td[data-row]');
                    if (!td) return;
                    const row = parseInt(td.dataset.row);
                    const col = parseInt(td.dataset.col);
                    this.startEditing(row, col);
                });

                // Context menu
                container.addEventListener('contextmenu', (e) => {
                    const td = e.target.closest('td[data-row]');
                    if (!td) return;
                    e.preventDefault();
                    this.contextCell = {
                        row: parseInt(td.dataset.row),
                        col: parseInt(td.dataset.col)
                    };
                    this.showContextMenu(e.clientX, e.clientY);
                });

                // Column header click -> sort
                document.getElementById('tableHead').addEventListener('click', (e) => {
                    const th = e.target.closest('th.col-header');
                    if (!th) return;
                    const colIdx = parseInt(th.dataset.col);
                    const colName = this.headers[colIdx];
                    if (!colName) return;
                    this.sortByColumn(colName);
                });

                // Formula bar input
                const formulaInput = document.getElementById('formulaInput');
                formulaInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        this.commitFormulaBar();
                    } else if (e.key === 'Escape') {
                        e.preventDefault();
                        formulaInput.blur();
                    }
                });

                // Keyboard navigation
                document.addEventListener('keydown', (e) => {
                    if (this.editing) return;
                    if (document.getElementById('pickerOverlay').classList.contains('visible')) return;
                    if (e.target.closest('.formula-input-wrapper')) return;
                    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

                    const { row, col } = this.selectedCell;
                    switch (e.key) {
                        case 'ArrowUp':    e.preventDefault(); this.selectCell(Math.max(0, row - 1), col); break;
                        case 'ArrowDown':  e.preventDefault(); this.selectCell(Math.min(this.rowCount - 1, row + 1), col); break;
                        case 'ArrowLeft':  e.preventDefault(); this.selectCell(row, Math.max(0, col - 1)); break;
                        case 'ArrowRight': e.preventDefault(); this.selectCell(row, Math.min(this.colCount - 1, col + 1)); break;
                        case 'Tab':
                            e.preventDefault();
                            if (e.shiftKey) this.selectCell(row, Math.max(0, col - 1));
                            else this.selectCell(row, Math.min(this.colCount - 1, col + 1));
                            break;
                        case 'Enter':
                            e.preventDefault();
                            this.startEditing(row, col);
                            break;
                        case 'Delete':
                        case 'Backspace':
                            e.preventDefault();
                            this.clearCurrentCell();
                            break;
                        default:
                            // Start typing directly into cell
                            if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) {
                                this.startEditing(row, col, e.key);
                                e.preventDefault();
                            }
                    }
                });

                // Click outside context menu to close
                document.addEventListener('click', (e) => {
                    if (!e.target.closest('.context-menu')) {
                        document.getElementById('contextMenu').classList.remove('visible');
                    }
                });

                // Context menu items
                document.getElementById('contextMenu').addEventListener('click', (e) => {
                    const item = e.target.closest('.context-menu-item');
                    if (!item) return;
                    document.getElementById('contextMenu').classList.remove('visible');
                    this.handleContextAction(item.dataset.action);
                });

                // Search input
                let searchTimeout = null;
                const searchInput = document.getElementById('searchInput');
                if (searchInput) {
                    searchInput.addEventListener('input', () => {
                        clearTimeout(searchTimeout);
                        searchTimeout = setTimeout(() => this.performSearch(searchInput.value), 300);
                    });
                    searchInput.addEventListener('keydown', (e) => {
                        if (e.key === 'Escape') { searchInput.value = ''; loadDataFromPhoton(); }
                    });
                }
            }

            selectCell(row, col) {
                this.selectedCell = { row, col };
                this.render();
                this.fetchCellForFormulaBar(row, col);
            }

            updateCellRef() {
                const ref = indexToCellRef(this.selectedCell.row, this.selectedCell.col);
                document.getElementById('cellRef').textContent = ref;
            }

            async fetchCellForFormulaBar(row, col) {
                const ref = indexToCellRef(row, col);
                document.getElementById('cellRef').textContent = ref;

                // Check local formula map first
                const formula = this.backendFormulas[ref];
                const formulaInput = document.getElementById('formulaInput');

                if (formula) {
                    formulaInput.value = formula;
                } else if (app) {
                    // Fetch from backend for latest raw value
                    try {
                        const result = parseMCP(await app.get({ cell: ref }));
                        if (result && result.raw != null) {
                            formulaInput.value = result.raw;
                        } else {
                            formulaInput.value = this.data[row]?.[col] || '';
                        }
                    } catch {
                        formulaInput.value = this.data[row]?.[col] || '';
                    }
                } else {
                    formulaInput.value = this.data[row]?.[col] || '';
                }
            }

            async commitFormulaBar() {
                const ref = indexToCellRef(this.selectedCell.row, this.selectedCell.col);
                const value = document.getElementById('formulaInput').value;
                await this.setCellValue(ref, value);
                document.getElementById('formulaInput').blur();
            }

            startEditing(row, col, initialChar) {
                this.editing = true;
                const td = document.querySelector(`td[data-row="${row}"][data-col="${col}"]`);
                if (!td) return;

                const ref = indexToCellRef(row, col);
                const formula = this.backendFormulas[ref];
                const currentValue = formula || this.data[row]?.[col] || '';

                const input = document.createElement('input');
                input.type = 'text';
                input.value = initialChar != null ? initialChar : currentValue;
                input.style.cssText = 'width:100%;height:100%;border:none;outline:none;padding:0 6px;font-size:13px;background:var(--cell-active);color:var(--text-primary);font-family:inherit;';
                td.innerHTML = '';
                td.appendChild(input);
                input.focus();
                if (initialChar != null) {
                    input.setSelectionRange(input.value.length, input.value.length);
                } else {
                    input.select();
                }

                const commit = async () => {
                    this.editing = false;
                    const newValue = input.value;
                    await this.setCellValue(ref, newValue);
                };

                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') { e.preventDefault(); commit(); }
                    else if (e.key === 'Escape') { e.preventDefault(); this.editing = false; this.render(); }
                    else if (e.key === 'Tab') { e.preventDefault(); commit().then(() => {
                        if (e.shiftKey) this.selectCell(row, Math.max(0, col - 1));
                        else this.selectCell(row, Math.min(this.colCount - 1, col + 1));
                    }); }
                });
                input.addEventListener('blur', () => {
                    if (this.editing) commit();
                });
            }

            async setCellValue(ref, value) {
                if (!app) {
                    // No backend — just set locally
                    const idx = cellRefToIndex(ref);
                    if (idx && this.data[idx.row]) {
                        this.data[idx.row][idx.col] = value;
                    }
                    this.render();
                    return;
                }

                try {
                    this.updateStatus('Saving...');
                    const result = parseMCP(await app.set({ cell: ref, value: String(value) }));
                    if (result) {
                        this.loadFromSnapshot(result);
                    }
                } catch (err) {
                    this.updateStatus('Error: ' + (err.message || err));
                }
            }

            async clearCurrentCell() {
                const ref = indexToCellRef(this.selectedCell.row, this.selectedCell.col);
                if (app) {
                    try {
                        const result = parseMCP(await app.clear({ range: ref }));
                        if (result) this.loadFromSnapshot(result);
                    } catch (err) {
                        this.updateStatus('Error: ' + (err.message || err));
                    }
                } else {
                    this.data[this.selectedCell.row][this.selectedCell.col] = '';
                    this.render();
                }
            }

            // ── Row/Column Operations ──

            async addRow() {
                if (!app) return;
                try {
                    this.updateStatus('Adding row...');
                    // Add empty row with column names as keys
                    const values = {};
                    this.headers.forEach(h => { values[h] = ''; });
                    const result = parseMCP(await app.add({ values }));
                    if (result) this.loadFromSnapshot(result);
                } catch (err) {
                    this.updateStatus('Error: ' + (err.message || err));
                }
            }

            async addColumn() {
                if (!app) return;
                const name = prompt('Column name:');
                if (!name) return;
                try {
                    this.updateStatus('Adding column...');
                    // Insert after last column
                    const lastCol = colToLetter(this.colCount);
                    const result = parseMCP(await app.insertColumn({ column: lastCol, name }));
                    if (result) this.loadFromSnapshot(result);
                } catch (err) {
                    this.updateStatus('Error: ' + (err.message || err));
                }
            }

            async newFile() {
                const name = prompt('New spreadsheet name:');
                if (!name) return;
                await this.switchSheet(name.replace(/\.csv$/i, ''));
            }

            async openImportModal() {
                const csv = prompt('Paste CSV data (first row = headers):');
                if (!csv || !app) return;
                try {
                    this.updateStatus('Importing...');
                    const result = parseMCP(await app.ingest({ csv }));
                    if (result) this.loadFromSnapshot(result);
                } catch (err) {
                    this.updateStatus('Error: ' + (err.message || err));
                }
            }

            async exportCSV() {
                if (!app) return;
                try {
                    const result = parseMCP(await app.dump());
                    if (result && result.csv) {
                        const blob = new Blob([result.csv], { type: 'text/csv' });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = (this.currentTable || 'spreadsheet') + '.csv';
                        a.click();
                        URL.revokeObjectURL(url);
                        this.updateStatus('Exported CSV');
                    }
                } catch (err) {
                    this.updateStatus('Error: ' + (err.message || err));
                }
            }

            // ── Sort ──

            async sortByColumn(colName) {
                if (!app) return;
                const dir = (this.sortState.column === colName && this.sortState.direction === 'asc') ? 'desc' : 'asc';
                try {
                    this.updateStatus(`Sorting by ${colName}...`);
                    const result = parseMCP(await app.sort({ column: colName, order: dir }));
                    this.sortState = { column: colName, direction: dir };
                    if (result) this.loadFromSnapshot(result);
                } catch (err) {
                    this.updateStatus('Error: ' + (err.message || err));
                }
            }

            // ── Context Menu ──

            showContextMenu(x, y) {
                const menu = document.getElementById('contextMenu');
                menu.style.left = x + 'px';
                menu.style.top = y + 'px';
                menu.classList.add('visible');
            }

            async handleContextAction(action) {
                if (!this.contextCell) return;
                const { row, col } = this.contextCell;
                const rowNum = row + 1;
                const colName = this.headers[col] || colToLetter(col);

                switch (action) {
                    case 'insert-row-above':
                        if (app) {
                            const r = parseMCP(await app.insertRow({ row: rowNum }));
                            if (r) this.loadFromSnapshot(r);
                        }
                        break;
                    case 'insert-row-below':
                        if (app) {
                            const r = parseMCP(await app.insertRow({ row: rowNum + 1 }));
                            if (r) this.loadFromSnapshot(r);
                        }
                        break;
                    case 'insert-col-left':
                        if (app) {
                            const name = prompt('New column name:');
                            if (!name) return;
                            const r = parseMCP(await app.insertColumn({ column: colName, name }));
                            if (r) this.loadFromSnapshot(r);
                        }
                        break;
                    case 'insert-col-right': {
                        if (app) {
                            const name = prompt('New column name:');
                            if (!name) return;
                            const nextCol = col + 1 < this.colCount ? this.headers[col + 1] : colToLetter(col + 1);
                            const r = parseMCP(await app.insertColumn({ column: nextCol, name }));
                            if (r) this.loadFromSnapshot(r);
                        }
                        break;
                    }
                    case 'delete-row':
                        if (app) {
                            const r = parseMCP(await app.remove({ row: rowNum }));
                            if (r) this.loadFromSnapshot(r);
                        }
                        break;
                    case 'delete-col':
                        if (app) {
                            const r = parseMCP(await app.removeColumn({ column: colName }));
                            if (r) this.loadFromSnapshot(r);
                        }
                        break;
                    case 'fill': {
                        const range = prompt('Range (e.g. A1:A10):');
                        const value = prompt('Fill pattern (comma-separated):');
                        if (range && value && app) {
                            const r = parseMCP(await app.fill({ range, pattern: value }));
                            if (r) this.loadFromSnapshot(r);
                        }
                        break;
                    }
                    case 'clear': {
                        const ref = indexToCellRef(row, col);
                        if (app) {
                            const r = parseMCP(await app.clear({ range: ref }));
                            if (r) this.loadFromSnapshot(r);
                        }
                        break;
                    }
                    case 'rename': {
                        const newName = prompt(`Rename column "${colName}" to:`);
                        if (newName && app) {
                            const r = parseMCP(await app.rename({ column: colName, name: newName }));
                            if (r) this.loadFromSnapshot(r);
                        }
                        break;
                    }
                }
            }

            // ── Search ──

            async performSearch(query) {
                if (!query || !query.trim()) {
                    // Empty search — reload full data
                    await loadDataFromPhoton();
                    return;
                }
                if (!app) return;
                try {
                    this.updateStatus('Searching...');
                    const result = parseMCP(await app.search({ query: query.trim() }));
                    if (result && result.data) {
                        this.loadFromSnapshot(result);
                        this.updateStatus(`Found ${result.data.length} result(s) for "${query.trim()}"`);
                    } else if (result && result.message) {
                        this.updateStatus(result.message);
                    }
                } catch (err) {
                    this.updateStatus('Search error: ' + (err.message || err));
                }
            }

            updateStatus(msg) {
                const el = document.getElementById('cellCount');
                if (el) el.textContent = msg;
                const rc = document.getElementById('recordCount');
                if (rc) rc.textContent = `${this.rowCount} rows \u00d7 ${this.colCount} cols`;
            }
        }

        const spreadsheet = new SpreadsheetEngine();
        let allTables = [];

        // ── Load data from backend ──

        async function loadDataFromPhoton() {
            if (!app) return;
            try {
                spreadsheet.updateStatus('Loading...');
                const result = parseMCP(await app.main());
                if (result) {
                    spreadsheet.loadFromSnapshot(result);
                }
                // Also refresh table list
                loadTableList();
            } catch (err) {
                spreadsheet.updateStatus('Error: ' + (err.message || err));
            }
        }

        // ── File Picker ──

        function showFilePicker() {
            document.getElementById('pickerOverlay').classList.add('visible');
            document.getElementById('pickerSearch').value = '';
            document.getElementById('pickerSearch').focus();
            loadTableList();
        }

        function hideFilePicker() {
            document.getElementById('pickerOverlay').classList.remove('visible');
        }

        function renderPickerList(query) {
            const list = document.getElementById('pickerList');
            const q = (query || '').toLowerCase();
            const filtered = allTables.filter(t =>
                !q || t.name.toLowerCase().includes(q) || t.file.toLowerCase().includes(q)
            );

            if (!filtered.length) {
                list.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted);">No spreadsheets found</div>';
                return;
            }

            list.innerHTML = filtered.map(t => {
                const sizeStr = t.size < 1024 ? t.size + ' B' :
                    t.size < 1048576 ? (t.size / 1024).toFixed(1) + ' KB' :
                    (t.size / 1048576).toFixed(1) + ' MB';
                const active = t.name === spreadsheet.currentTable;
                return `<button class="picker-item" data-name="${t.name}">
                    <div class="icon">${active ? '\uD83D\uDCDD' : '\uD83D\uDCCA'}</div>
                    <div class="info">
                        <div class="name">${t.name}</div>
                        <div class="meta">${sizeStr} \u00b7 ${timeAgo(t.modified)}</div>
                    </div>
                </button>`;
            }).join('');

            list.querySelectorAll('.picker-item').forEach(el => {
                el.addEventListener('click', () => {
                    spreadsheet.switchSheet(el.dataset.name);
                    hideFilePicker();
                });
            });
        }

        function timeAgo(iso) {
            if (!iso) return '';
            const diff = Date.now() - new Date(iso).getTime();
            const mins = Math.floor(diff / 60000);
            if (mins < 1) return 'just now';
            if (mins < 60) return mins + 'm ago';
            const hrs = Math.floor(mins / 60);
            if (hrs < 24) return hrs + 'h ago';
            return Math.floor(hrs / 24) + 'd ago';
        }

        async function loadTableList() {
            if (!app) return;
            try {
                let result = await app.list_tables();
                result = parseMCP(result);
                if (result && result.tables) {
                    allTables = result.tables;
                    renderPickerList('');
                    spreadsheet.renderSheetList(result.tables);
                }
            } catch (e) { /* ignore */ }
        }

        function createFromPicker() {
            const input = document.getElementById('newFileName');
            const name = input.value.trim().replace(/\.csv$/i, '');
            if (!name) return;
            spreadsheet.switchSheet(name);
            hideFilePicker();
            input.value = '';
        }

        // Picker events
        document.getElementById('pickerSearch').addEventListener('input', (e) => {
            renderPickerList(e.target.value);
        });
        document.getElementById('pickerOverlay').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) hideFilePicker();
        });
        document.getElementById('newFileName').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') createFromPicker();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && document.getElementById('pickerOverlay').classList.contains('visible')) {
                hideFilePicker();
            }
        });

        // ── Photon Bridge ──

        function setupPhotonBridge() {
            if (!window.photon) { setTimeout(setupPhotonBridge, 100); return; }

            // Listen for live results from any backend call (including from other clients)
            window.photon.onResult?.((result) => {
                const data = parseMCP(result);
                if (data && (data.headers || data.data)) {
                    spreadsheet.loadFromSnapshot(data);
                }
            });

            // Listen for @stateful events
            window.photon.onEmit?.((event) => {
                // Refresh on any data mutation event
                if (event && event.result && (event.result.headers || event.result.data)) {
                    spreadsheet.loadFromSnapshot(event.result);
                }
            });

            // Initial load
            loadDataFromPhoton();
        }
        document.addEventListener('DOMContentLoaded', setupPhotonBridge);
    </script>
    <script src="mcp-bridge.js"></script>
</body>
