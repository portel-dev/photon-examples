<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slides</title>
  <style id="marp-style"></style>
  <style>
    :root {
      --accent: #67c7ff;
      --bg: #0a0e1a;
      --surface: #111827;
      --surface2: #1a2035;
      --line: rgba(255,255,255,0.1);
      --text: #e5e5e5;
      --muted: rgba(255,255,255,0.45);
      --spring: cubic-bezier(0.16, 1, 0.3, 1);
      --filmstrip-w: 180px;
      --toolbar-h: 44px;
    }

    * { box-sizing: border-box; margin: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
    }

    /* ══════════════════════════════════════════
       TOOLBAR
       ══════════════════════════════════════════ */

    .toolbar {
      height: var(--toolbar-h);
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 8px;
      flex-shrink: 0;
      z-index: 100;
      overflow-x: auto;
    }

    .toolbar .deck-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-right: auto;
    }

    .toolbar .ai-dot {
      width: 6px; height: 6px;
      background: var(--accent);
      border-radius: 50%;
      animation: pulse 2.5s infinite;
    }

    .tb-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--line);
      color: var(--text);
      cursor: pointer;
      font-size: 12px;
      padding: 5px 12px;
      border-radius: 6px;
      white-space: nowrap;
      transition: background 0.15s;
    }

    .tb-btn:hover { background: rgba(255,255,255,0.12); }
    .tb-btn.primary { background: rgba(103,199,255,0.15); border-color: rgba(103,199,255,0.3); color: var(--accent); }
    .tb-btn.primary:hover { background: rgba(103,199,255,0.25); }
    .tb-btn:disabled { opacity: 0.3; cursor: default; }

    .tb-icon { font-size: 16px; padding: 4px 10px; min-width: 34px; text-align: center; }

    .tb-select {
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--line);
      color: var(--text);
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
    }
    .tb-select option { background: var(--surface); }

    .tb-sep { width: 1px; height: 20px; background: var(--line); flex-shrink: 0; }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(103,199,255,0.5); }
      70% { box-shadow: 0 0 0 6px rgba(103,199,255,0); }
      100% { box-shadow: 0 0 0 0 rgba(103,199,255,0); }
    }

    /* ══════════════════════════════════════════
       AUTHORING LAYOUT
       ══════════════════════════════════════════ */

    .authoring {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Properties Panel (Keynote-style right sidebar) ── */

    .props-panel {
      width: 220px;
      background: var(--surface);
      border-left: 1px solid var(--line);
      flex-shrink: 0;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .props-panel.hidden { display: none; }

    .props-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }

    .props-group:last-child { border-bottom: none; }

    .props-group-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
    }

    .props-section {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .props-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      font-weight: 600;
    }

    .props-select {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--line);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      outline: none;
    }

    .props-select:focus { border-color: var(--accent); }
    .props-select option { background: var(--surface); }

    .props-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .props-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
    }

    .props-row span:last-child {
      color: var(--text);
      font-weight: 500;
    }

    /* ── Filmstrip ── */

    .filmstrip {
      width: var(--filmstrip-w);
      background: var(--surface);
      border-right: 1px solid var(--line);
      overflow-y: auto;
      flex-shrink: 0;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .filmstrip::-webkit-scrollbar { width: 4px; }
    .filmstrip::-webkit-scrollbar-track { background: transparent; }
    .filmstrip::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }

    .thumb {
      position: relative;
      border: 2px solid transparent;
      border-radius: 6px;
      cursor: pointer;
      overflow: hidden;
      background: white;
      aspect-ratio: 16/9;
      transition: border-color 0.15s;
    }

    .thumb:hover { border-color: rgba(255,255,255,0.3); }
    .thumb.selected { border-color: var(--accent); }

    .thumb-num {
      position: absolute;
      bottom: 2px;
      right: 4px;
      font-size: 9px;
      color: var(--muted);
      background: rgba(0,0,0,0.6);
      padding: 1px 4px;
      border-radius: 3px;
    }

    .thumb-inner {
      width: 960px;
      height: 540px;
      transform: scale(var(--thumb-scale, 0.16));
      transform-origin: top left;
      pointer-events: none;
      overflow: hidden;
    }

    .thumb-inner section,
    .thumb-inner svg {
      width: 960px !important;
      height: 540px !important;
    }

    .thumb.drag-over { border-color: var(--accent); border-style: dashed; }
    .thumb.dragging { opacity: 0.4; }

    /* ── Deck Picker Overlay ── */

    /* ── Deck Picker ── */
    .deck-picker {
      position: fixed;
      inset: 0;
      z-index: 500;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .deck-picker.hidden { display: none; }

    .deck-picker-modal {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      width: 560px;
      max-width: 90vw;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: picker-in 0.2s var(--spring) both;
    }

    @keyframes picker-in {
      from { opacity: 0; transform: scale(0.95) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .deck-picker-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 20px 24px 16px;
      border-bottom: 1px solid var(--line);
    }

    .deck-picker-header .icon {
      width: 40px;
      height: 40px;
      background: rgba(103,199,255,0.1);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .deck-picker-header .header-text h2 {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      margin: 0;
    }

    .deck-picker-header .header-text p {
      font-size: 12px;
      color: var(--muted);
      margin: 2px 0 0;
    }

    .deck-picker-header .close-btn {
      margin-left: auto;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: none;
      color: var(--muted);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    .deck-picker-header .close-btn:hover { background: rgba(255,255,255,0.06); color: var(--text); }

    .deck-picker-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      padding: 14px 24px 8px;
    }

    .deck-grid {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 0 16px 12px;
      overflow-y: auto;
      flex: 1;
    }

    .deck-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 14px;
      border-radius: 10px;
      cursor: pointer;
      border: 1px solid transparent;
      background: none;
      transition: all 0.12s;
      width: 100%;
      text-align: left;
    }

    .deck-card:hover {
      background: rgba(255,255,255,0.04);
      border-color: var(--line);
    }

    .deck-card .deck-thumb {
      width: 64px;
      height: 36px;
      background: rgba(255,255,255,0.08);
      border-radius: 6px;
      border: 1px solid var(--line);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: var(--muted);
      overflow: hidden;
    }

    .deck-card .deck-info {
      flex: 1;
      min-width: 0;
    }

    .deck-card .deck-title {
      font-weight: 500;
      font-size: 14px;
      color: var(--text);
    }

    .deck-card .deck-meta {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    .deck-picker-footer {
      padding: 14px 20px;
      border-top: 1px solid var(--line);
      display: flex;
      gap: 8px;
    }

    .deck-picker-footer input {
      flex: 1;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--line);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
    }

    .deck-picker-footer input:focus { border-color: rgba(103,199,255,0.4); }
    .deck-picker-footer input::placeholder { color: var(--muted); }

    .deck-create {
      display: flex;
      gap: 8px;
      max-width: 400px;
      width: 100%;
      padding: 0 24px;
    }

    .deck-create input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--line);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }

    .deck-create input:focus { border-color: var(--accent); }
    .deck-create input::placeholder { color: var(--muted); }

    /* ── Main Area ── */

    .main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Slide Preview ── */

    .preview-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
      background: var(--bg);
    }

    .preview-frame {
      background: white;
      border-radius: 6px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      overflow: hidden;
      aspect-ratio: 16/9;
      width: 100%;
      max-height: 100%;
      position: relative;
    }

    .preview-inner {
      width: 960px;
      height: 540px;
      transform-origin: top left;
      position: absolute;
      top: 0;
      left: 0;
    }

    .preview-inner section,
    .preview-inner svg {
      width: 960px !important;
      height: 540px !important;
    }

    /* ── Editor Panel ── */

    .editor-panel {
      height: 200px;
      background: var(--surface);
      border-top: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .editor-tabs {
      display: flex;
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }

    .editor-tab {
      background: none;
      border: none;
      color: var(--muted);
      padding: 8px 16px;
      font-size: 12px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color 0.15s, border-color 0.15s;
    }

    .editor-tab:hover { color: var(--text); }
    .editor-tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

    .editor-textarea {
      flex: 1;
      background: var(--surface2);
      color: var(--text);
      border: none;
      padding: 12px;
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      font-size: 13px;
      line-height: 1.5;
      resize: none;
      outline: none;
      tab-size: 2;
    }

    .editor-textarea::placeholder { color: var(--muted); }

    /* ── Resize Handle ── */

    .resize-handle {
      height: 4px;
      background: var(--line);
      cursor: row-resize;
      flex-shrink: 0;
    }

    .resize-handle:hover { background: var(--accent); }

    /* ══════════════════════════════════════════
       PRESENTATION MODE (fullscreen)
       ══════════════════════════════════════════ */

    .present-mode {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: black;
    }

    .present-mode.active { display: block; }

    .present-mode #present-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .present-mode #present-container > section,
    .present-mode #present-container > svg {
      display: none;
      position: absolute;
      width: 1280px !important;
      height: 720px !important;
      transform-origin: center center;
    }

    .present-mode #present-container > section.active,
    .present-mode #present-container > svg.active {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .present-mode #present-container > section.active > svg,
    .present-mode #present-container > svg.active > svg {
      width: 1280px !important;
      height: 720px !important;
    }

    .present-controls {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 1001;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 12px;
      padding: 60px 20px 12px;
      background: linear-gradient(to top, rgba(0,0,0,0.6), transparent);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .present-controls:hover { opacity: 1; }

    .present-progress {
      font-size: 13px;
      color: rgba(255,255,255,0.5);
      font-variant-numeric: tabular-nums;
    }

    /* ── Transitions (presentation mode only) ── */

    @keyframes t-fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes t-slide-r { from { opacity:0; transform:translateX(80px); } to { opacity:1; transform:translateX(0); } }
    @keyframes t-slide-l { from { opacity:0; transform:translateX(-80px); } to { opacity:1; transform:translateX(0); } }
    @keyframes t-scale { from { opacity:0; transform:scale(0.85); } to { opacity:1; transform:scale(1); } }
    @keyframes t-zoom { from { opacity:0; transform:scale(1.3); } to { opacity:1; transform:scale(1); } }

    [data-transition="fade"] > .active { animation: t-fade 0.4s ease-out both; }
    [data-transition="slide"] > .active { animation: t-slide-r 0.4s var(--spring) both; }
    [data-transition="slide-back"] > .active { animation: t-slide-l 0.4s var(--spring) both; }
    [data-transition="scale"] > .active { animation: t-scale 0.4s var(--spring) both; }
    [data-transition="zoom"] > .active { animation: t-zoom 0.4s var(--spring) both; }
    [data-transition="none"] > .active { animation: none; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <!-- ══ Deck Picker ══ -->
  <div class="deck-picker hidden" id="deck-picker">
    <div class="deck-picker-modal">
      <div class="deck-picker-header">
        <div class="icon">📽️</div>
        <div class="header-text">
          <h2>Open Presentation</h2>
          <p>Select a deck to edit or create a new one</p>
        </div>
        <button class="close-btn" id="deck-close-btn" title="Back to editor">&times;</button>
      </div>
      <div class="deck-picker-label">Your Decks</div>
      <div class="deck-grid" id="deck-grid"></div>
      <div class="deck-picker-footer">
        <input type="text" id="new-deck-name" placeholder="New deck name..." />
        <button class="tb-btn primary" id="create-deck-btn">Create</button>
      </div>
    </div>
  </div>

  <!-- ══ Toolbar ══ -->
  <div class="toolbar">
    <div class="ai-dot"></div>
    <span class="deck-name" id="deck-name">Slides</span>

    <button class="tb-btn tb-icon" id="decks-btn" title="Switch deck"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg></button>
    <div class="tb-sep"></div>
    <button class="tb-btn tb-icon" id="add-btn" title="Add slide"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
    <button class="tb-btn tb-icon" id="dup-btn" title="Duplicate slide"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg></button>
    <button class="tb-btn tb-icon" id="del-btn" title="Delete slide"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg></button>

    <div style="flex:1;"></div>

    <button class="tb-btn tb-icon" id="prev-btn" title="Previous slide">◂</button>
    <span class="slide-counter" id="slide-counter" style="font-size:12px;color:var(--muted);min-width:50px;text-align:center;"></span>
    <button class="tb-btn tb-icon" id="next-btn" title="Next slide">▸</button>
    <div class="tb-sep"></div>
    <button class="tb-btn tb-icon" id="props-toggle" title="Toggle properties">⚙</button>
    <button class="tb-btn tb-icon primary" id="present-btn" title="Present">▶</button>
  </div>

  <!-- ══ Authoring View ══ -->
  <div class="authoring">
    <div class="filmstrip" id="filmstrip"></div>
    <div class="main-area">
      <div class="preview-container">
        <div class="preview-frame" id="preview-frame">
          <div class="preview-inner" id="preview-inner"></div>
        </div>
      </div>
      <div class="resize-handle" id="resize-handle"></div>
      <div class="editor-panel" id="editor-panel">
        <div class="editor-tabs">
          <button class="editor-tab active" data-tab="markdown">Slide <span id="editor-slide-num">1</span></button>
          <button class="editor-tab" data-tab="notes">Speaker Notes</button>
        </div>
        <textarea class="editor-textarea" id="editor" placeholder="Write slide content in Markdown..."></textarea>
        <textarea class="editor-textarea" id="notes-editor" placeholder="Speaker notes (only visible in presenter view)..." style="display:none;"></textarea>
      </div>
    </div>

    <!-- Properties Panel (Keynote-style right sidebar) -->
    <div class="props-panel" id="props-panel">
      <div class="props-group">
        <div class="props-group-title">Slide <span id="props-slide-num">1</span> of <span id="props-slide-total">1</span></div>
        <div class="props-section">
          <div class="props-label">Layout</div>
          <select class="props-select" id="layout-select">
            <option value="lead">Title (centered)</option>
            <option value="bullets">Bullets</option>
            <option value="cols-2">Two Columns</option>
            <option value="cols-3">Three Columns</option>
            <option value="img-left">Image Left</option>
            <option value="img-right">Image Right</option>
            <option value="quote-big">Quote</option>
            <option value="accent">Accent Background</option>
            <option value="invert">Inverted</option>
            <option value="blank">Blank</option>
          </select>
        </div>
        <div class="props-section">
          <div class="props-label">Transition</div>
          <select class="props-select" id="transition-select">
            <option value="fade">Fade</option>
            <option value="slide">Slide</option>
            <option value="scale">Scale</option>
            <option value="zoom">Zoom</option>
            <option value="none">None</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- ══ Presentation Mode (overlay) ══ -->
  <div class="present-mode" id="present-mode">
    <div id="present-container" data-transition="none"></div>
    <div class="present-controls">
      <button class="tb-btn" id="present-prev">◀</button>
      <span class="present-progress" id="present-progress">1 / 1</span>
      <button class="tb-btn" id="present-next">▶</button>
      <div class="tb-sep"></div>
      <button class="tb-btn" id="present-exit">✕ Exit</button>
    </div>
  </div>

  <script>
    const slidesApp = window["slides"];
    let slides = [];        // Array of { html, markdown, transition }
    let currentIdx = 0;
    let marpCSS = "";
    let editorDirty = false;
    let saveTimeout = null;

    // ── Parse MCP response ──

    function parseMCP(raw) {
      if (raw && raw.content && Array.isArray(raw.content)) {
        const item = raw.content.find(c => c.type === "text" && c.text);
        if (item) {
          try { return JSON.parse(item.text); } catch { return item.text; }
        }
      }
      return raw;
    }

    // ── Render from server data ──

    function handleData(data) {
      if (!data) return;
      if (data.type === "render" || (data.html && data.css)) {
        loadDeck(data);
      } else if (data.type === "nav" || typeof data.index === "number") {
        selectSlide(data.index);
      }
    }

    let fullMarkdown = "";
    let frontmatter = "";

    function loadDeck(data) {
      marpCSS = data.css || "";
      document.getElementById("marp-style").innerHTML = marpCSS;

      // Parse HTML into individual slides
      const tmp = document.createElement("div");
      tmp.innerHTML = data.html || "";
      const sections = tmp.querySelectorAll(":scope > section, :scope > svg");

      // Split full markdown into per-slide content
      fullMarkdown = data.markdown || "";
      const mdParts = splitMarkdownIntoSlides(fullMarkdown);
      frontmatter = mdParts.frontmatter;

      slides = [];
      sections.forEach((el, i) => {
        const transMatch = el.innerHTML.match(/<!--\s*transition:\s*(\w+)\s*-->/);
        const md = mdParts.slides[i] || "";
        const notesMatch = md.match(/<!--\s*notes?\s*:\s*([\s\S]*?)\s*-->/i);
        slides.push({
          html: el.outerHTML,
          markdown: notesMatch ? md.replace(notesMatch[0], "").trim() : md,
          notes: notesMatch ? notesMatch[1].trim() : "",
          transition: transMatch ? transMatch[1] : "fade",
        });
      });

      currentIdx = Math.min(data.current || 0, slides.length - 1);

      renderFilmstrip();
      selectSlide(currentIdx);
    }

    function splitMarkdownIntoSlides(md) {
      // Marp format: frontmatter (---...---) then slides separated by ---
      let frontmatter = "";
      let body = md;

      // Extract frontmatter
      const fmMatch = md.match(/^---\n[\s\S]*?\n---\n?/);
      if (fmMatch) {
        frontmatter = fmMatch[0];
        body = md.slice(fmMatch[0].length);
      }

      // Split remaining by --- on its own line
      const slides = body.split(/\n---\n/).map(s => s.trim()).filter(s => s.length > 0);
      return { frontmatter, slides };
    }

    // ── Filmstrip ──

    let dragFromIdx = -1;

    function renderFilmstrip() {
      const strip = document.getElementById("filmstrip");
      strip.innerHTML = "";
      const thumbW = 180 - 20; // padding
      const scale = thumbW / 960;

      slides.forEach((slide, i) => {
        const thumb = document.createElement("div");
        thumb.className = "thumb" + (i === currentIdx ? " selected" : "");
        thumb.setAttribute("draggable", "true");
        thumb.dataset.idx = i;
        thumb.onclick = () => selectSlide(i);

        // Drag events
        thumb.addEventListener("dragstart", (e) => {
          dragFromIdx = i;
          thumb.classList.add("dragging");
          e.dataTransfer.effectAllowed = "move";
        });
        thumb.addEventListener("dragend", () => {
          thumb.classList.remove("dragging");
          dragFromIdx = -1;
        });
        thumb.addEventListener("dragover", (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = "move";
          thumb.classList.add("drag-over");
        });
        thumb.addEventListener("dragleave", () => {
          thumb.classList.remove("drag-over");
        });
        thumb.addEventListener("drop", async (e) => {
          e.preventDefault();
          thumb.classList.remove("drag-over");
          const toIdx = i;
          if (dragFromIdx === -1 || dragFromIdx === toIdx) return;
          if (slidesApp) {
            const r = parseMCP(await slidesApp.move({ from: dragFromIdx, to: toIdx }));
            if (r && r.html) {
              loadDeck(r);
            } else {
              // Reorder locally if backend doesn't return full deck
              const [moved] = slides.splice(dragFromIdx, 1);
              slides.splice(toIdx, 0, moved);
              currentIdx = toIdx;
              renderFilmstrip();
              selectSlide(toIdx);
            }
          }
        });

        const inner = document.createElement("div");
        inner.className = "thumb-inner";
        inner.style.setProperty("--thumb-scale", scale);
        inner.innerHTML = slide.html;

        // Apply marp CSS to thumbnails
        const style = document.createElement("style");
        style.textContent = marpCSS;
        inner.prepend(style);

        const num = document.createElement("div");
        num.className = "thumb-num";
        num.textContent = i + 1;

        thumb.appendChild(inner);
        thumb.appendChild(num);
        strip.appendChild(thumb);
      });
    }

    // ── Slide Selection ──

    function selectSlide(idx) {
      // Save current editor content if dirty
      if (editorDirty && slides[currentIdx]) {
        saveCurrentSlide();
      }

      currentIdx = Math.max(0, Math.min(idx, slides.length - 1));

      // Update filmstrip selection
      document.querySelectorAll(".thumb").forEach((t, i) => {
        t.classList.toggle("selected", i === currentIdx);
      });

      // Scroll selected thumb into view
      const selected = document.querySelector(".thumb.selected");
      if (selected) selected.scrollIntoView({ block: "nearest" });

      // Update preview — render at 960x540 and scale to fit frame
      const inner = document.getElementById("preview-inner");
      if (slides[currentIdx]) {
        inner.innerHTML = slides[currentIdx].html;
        scalePreview();
      }

      // Update markdown editor
      const editor = document.getElementById("editor");
      editor.value = slides[currentIdx]?.markdown || "";
      editorDirty = false;
      document.getElementById("editor-slide-num").textContent = currentIdx + 1;

      // Update notes editor
      const notesEditor = document.getElementById("notes-editor");
      notesEditor.value = slides[currentIdx]?.notes || "";

      // Update properties panel and toolbar counter
      const propsNum = document.getElementById("props-slide-num");
      const propsTotal = document.getElementById("props-slide-total");
      if (propsNum) propsNum.textContent = currentIdx + 1;
      if (propsTotal) propsTotal.textContent = slides.length;
      const counter = document.getElementById("slide-counter");
      if (counter) counter.textContent = `${currentIdx + 1} / ${slides.length}`;

      // Detect current layout from _class directive or markdown structure
      const md = slides[currentIdx]?.markdown || '';
      const layoutSel = document.getElementById("layout-select");
      if (layoutSel) {
        const classMatch = md.match(/<!--\s*_class:\s*(\S+)/);
        if (classMatch) {
          layoutSel.value = classMatch[1];
        } else if (/^#\s+.+\n+###\s+/m.test(md)) {
          layoutSel.value = 'lead';
        } else if (/^>\s+/m.test(md)) {
          layoutSel.value = 'quote-big';
        } else if (md.trim() === '') {
          layoutSel.value = 'blank';
        } else {
          layoutSel.value = 'bullets';
        }
      }

      // Update transition dropdown
      document.getElementById("transition-select").value = slides[currentIdx]?.transition || "fade";
    }

    // ── Preview Scaling ──

    function scalePreview() {
      const frame = document.getElementById("preview-frame");
      const inner = document.getElementById("preview-inner");
      if (!frame || !inner) return;
      const fw = frame.clientWidth;
      const fh = frame.clientHeight;
      if (fw === 0 || fh === 0) return;
      const scale = Math.min(fw / 960, fh / 540);
      inner.style.transform = `scale(${scale})`;
    }

    new ResizeObserver(scalePreview).observe(document.getElementById("preview-frame"));

    // ── Editor ──

    function saveCurrentSlide() {
      if (!slides[currentIdx]) return;
      const editor = document.getElementById("editor");
      const notesEditor = document.getElementById("notes-editor");
      const newMarkdown = editor.value;
      const newNotes = notesEditor.value;

      slides[currentIdx].markdown = newMarkdown;
      slides[currentIdx].notes = newNotes;
      editorDirty = false;

      if (!slidesApp) return;

      // Build per-slide content (markdown + notes)
      let content = newMarkdown;
      if (newNotes) content += `\n\n<!-- notes: ${newNotes} -->`;

      // Save full deck — more reliable than per-slide edit
      const slideContents = slides.map((s, i) => {
        let c = (i === currentIdx) ? content : s.markdown;
        if (s.notes && i !== currentIdx) c += `\n\n<!-- notes: ${s.notes} -->`;
        else if (newNotes && i === currentIdx) c += `\n\n<!-- notes: ${newNotes} -->`;
        return c;
      });
      const fullMd = frontmatter + slideContents.join("\n\n---\n\n");
      slidesApp.save({ markdown: fullMd }).then(r => {
        const data = parseMCP(r);
        if (data && data.html) {
          marpCSS = data.css || marpCSS;
          document.getElementById("marp-style").innerHTML = marpCSS;
          const tmp = document.createElement("div");
          tmp.innerHTML = data.html;
          const sections = tmp.querySelectorAll(":scope > section, :scope > svg");
          sections.forEach((el, i) => {
            if (slides[i]) slides[i].html = el.outerHTML;
          });
          const inner = document.getElementById("preview-inner");
          if (slides[currentIdx]) inner.innerHTML = slides[currentIdx].html;
          scalePreview();
          renderFilmstrip();
        }
      });
    }

    document.getElementById("editor").addEventListener("input", () => {
      editorDirty = true;
      clearTimeout(saveTimeout);
      saveTimeout = setTimeout(saveCurrentSlide, 800);
    });

    document.getElementById("notes-editor").addEventListener("input", () => {
      editorDirty = true;
      clearTimeout(saveTimeout);
      saveTimeout = setTimeout(saveCurrentSlide, 800);
    });

    // ── Editor Tab Switching ──

    document.querySelectorAll(".editor-tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".editor-tab").forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        const which = tab.dataset.tab;
        document.getElementById("editor").style.display = which === "markdown" ? "" : "none";
        document.getElementById("notes-editor").style.display = which === "notes" ? "" : "none";
      });
    });

    // ── Toolbar Actions ──

    document.getElementById("add-btn").addEventListener("click", async () => {
      if (slidesApp) {
        const r = parseMCP(await slidesApp.add({ content: "# New Slide\n\nContent here", index: currentIdx + 1 }));
        if (r && r.html) loadDeck(r);
        selectSlide(currentIdx + 1);
      }
    });

    document.getElementById("dup-btn").addEventListener("click", async () => {
      if (slidesApp) {
        const r = parseMCP(await slidesApp.duplicate({ index: currentIdx }));
        if (r && r.html) loadDeck(r);
        selectSlide(currentIdx + 1);
      }
    });

    document.getElementById("del-btn").addEventListener("click", async () => {
      if (slides.length <= 1) return;
      if (slidesApp) {
        const r = parseMCP(await slidesApp.remove({ index: currentIdx }));
        if (r && r.html) loadDeck(r);
        selectSlide(Math.min(currentIdx, slides.length - 1));
      }
    });

    document.getElementById("decks-btn").addEventListener("click", () => {
      showDeckPicker();
    });

    document.getElementById("prev-btn").addEventListener("click", () => {
      if (currentIdx > 0) selectSlide(currentIdx - 1);
    });

    document.getElementById("next-btn").addEventListener("click", () => {
      if (currentIdx < slides.length - 1) selectSlide(currentIdx + 1);
    });

    document.getElementById("transition-select").addEventListener("change", (e) => {
      if (slides[currentIdx]) {
        slides[currentIdx].transition = e.target.value;
      }
    });

    // ── Layout Picker ──

    // Layout templates — used when creating new slides with a layout
    const LAYOUT_TEMPLATES = {
      lead: '# Title\n### Subtitle',
      bullets: '## Section Title\n\n- First point\n- Second point\n- Third point',
      'cols-2': '## Left Column\n\nContent here.\n\n## Right Column\n\nContent here.',
      'cols-3': '## One\n\nFirst.\n\n## Two\n\nSecond.\n\n## Three\n\nThird.',
      'img-left': '![](https://picsum.photos/600/400)\n\n## Title\n\nDescription text.',
      'img-right': '## Title\n\nDescription text.\n\n![](https://picsum.photos/600/400)',
      'quote-big': '> "The best way to predict the future is to invent it."\n\n— Alan Kay',
      accent: '# Highlighted Slide\n\nThis slide uses the accent color.',
      invert: '# Inverted Slide\n\nLight text on dark background.',
      blank: '\n',
    };

    document.getElementById("layout-select").addEventListener("change", async (e) => {
      const layout = e.target.value;
      if (!layout || !slides[currentIdx]) return;

      let md = slides[currentIdx].markdown || '';

      // Remove existing _class directive
      md = md.replace(/<!--\s*_class:\s*[^>]*-->\s*\n?/g, '');

      // Add new _class directive (skip for 'bullets' which is default, no class needed)
      if (layout !== 'bullets' && layout !== 'blank') {
        md = `<!-- _class: ${layout} -->\n\n` + md.trim();
      }

      // If slide is empty/new, use template content
      const stripped = md.replace(/<!--[^>]*-->\s*/g, '').trim();
      if (!stripped) {
        const template = LAYOUT_TEMPLATES[layout] || '';
        if (layout !== 'bullets' && layout !== 'blank') {
          md = `<!-- _class: ${layout} -->\n\n` + template;
        } else {
          md = template;
        }
      }

      slides[currentIdx].markdown = md;
      document.getElementById("editor").value = md;
      editorDirty = true;
      await saveCurrentSlide();
    });

    // ── Presentation Mode ──

    let presentIdx = 0;

    document.getElementById("present-btn").addEventListener("click", () => {
      enterPresentation();
    });

    document.getElementById("present-exit").addEventListener("click", () => {
      exitPresentation();
    });

    function scalePresentSlides() {
      const container = document.getElementById("present-container");
      if (!container) return;
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const scale = Math.min(vw / 1280, vh / 720);
      container.querySelectorAll(":scope > section, :scope > svg").forEach(el => {
        el.style.transform = `scale(${scale})`;
      });
    }

    function enterPresentation() {
      const mode = document.getElementById("present-mode");
      const container = document.getElementById("present-container");
      container.innerHTML = slides.map(s => s.html).join("");
      container.setAttribute("data-transition", "none");

      presentIdx = currentIdx;
      const children = container.querySelectorAll(":scope > section, :scope > svg");
      children.forEach((s, i) => s.classList.toggle("active", i === presentIdx));

      document.getElementById("present-progress").textContent = `${presentIdx + 1} / ${slides.length}`;
      mode.classList.add("active");

      scalePresentSlides();

      // Try fullscreen
      document.body.requestFullscreen?.().catch(() => {});
    }

    window.addEventListener("resize", () => {
      if (document.getElementById("present-mode").classList.contains("active")) {
        scalePresentSlides();
      }
    });

    function exitPresentation() {
      document.getElementById("present-mode").classList.remove("active");
      if (document.fullscreenElement) document.exitFullscreen();
      selectSlide(presentIdx);
    }

    function presentNav(dir) {
      const container = document.getElementById("present-container");
      const children = container.querySelectorAll(":scope > section, :scope > svg");
      const newIdx = presentIdx + dir;
      if (newIdx < 0 || newIdx >= children.length) return;

      const transition = slides[newIdx]?.transition || "fade";
      container.setAttribute("data-transition", dir > 0 ? transition : (transition === "slide" ? "slide-back" : transition));
      const prev = container.querySelector(".active");
      if (prev) prev.classList.remove("active");
      void container.offsetHeight;
      presentIdx = newIdx;
      children[presentIdx].classList.add("active");
      document.getElementById("present-progress").textContent = `${presentIdx + 1} / ${slides.length}`;
    }

    document.getElementById("present-prev").addEventListener("click", () => presentNav(-1));
    document.getElementById("present-next").addEventListener("click", () => presentNav(1));

    // ── Editor Resize ──

    const resizeHandle = document.getElementById("resize-handle");
    let resizing = false;

    resizeHandle.addEventListener("mousedown", (e) => {
      resizing = true;
      e.preventDefault();
    });

    window.addEventListener("mousemove", (e) => {
      if (!resizing) return;
      const panel = document.getElementById("editor-panel");
      const rect = document.querySelector(".authoring").getBoundingClientRect();
      const newHeight = rect.bottom - e.clientY;
      panel.style.height = Math.max(80, Math.min(newHeight, rect.height - 100)) + "px";
    });

    window.addEventListener("mouseup", () => { resizing = false; });

    // ── Keyboard ──

    window.addEventListener("keydown", (e) => {
      const presenting = document.getElementById("present-mode").classList.contains("active");
      const inEditor = document.activeElement === document.getElementById("editor");

      if (presenting) {
        if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") {
          e.preventDefault(); presentNav(1);
        } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
          e.preventDefault(); presentNav(-1);
        } else if (e.key === "Escape") {
          exitPresentation();
        }
        return;
      }

      // Authoring shortcuts (not when typing in editor)
      if (!inEditor) {
        if (e.key === "ArrowDown" || e.key === "ArrowRight") {
          e.preventDefault();
          selectSlide(currentIdx + 1);
        } else if (e.key === "ArrowUp" || e.key === "ArrowLeft") {
          e.preventDefault();
          selectSlide(currentIdx - 1);
        } else if (e.key === "Enter" || e.key === "p") {
          enterPresentation();
        }
      }

      // Cmd+S to save
      if ((e.metaKey || e.ctrlKey) && e.key === "s") {
        e.preventDefault();
        saveCurrentSlide();
      }
    });

    // ── Fullscreen exit → back to authoring ──
    document.addEventListener("fullscreenchange", () => {
      if (!document.fullscreenElement && document.getElementById("present-mode").classList.contains("active")) {
        exitPresentation();
      }
    });

    // ── Deck Picker ──

    let deckLoaded = false;

    function showDeckPicker() {
      document.getElementById("deck-picker").classList.remove("hidden");
      if (slidesApp) {
        slidesApp.list().then(r => {
          const data = parseMCP(r);
          const grid = document.getElementById("deck-grid");
          const decks = data?.decks || [];

          if (decks.length === 0) {
            grid.innerHTML = '<p style="color:var(--muted);text-align:center;padding:24px;">No presentations yet. Create one below.</p>';
          } else {
            grid.innerHTML = decks.map(d => {
              const slideCount = d.slideCount || '?';
              const date = d.updatedAt ? new Date(d.updatedAt).toLocaleDateString() : '';
              return `
              <div class="deck-card" data-file="${d.file}">
                <div class="deck-thumb">${slideCount} slides</div>
                <div class="deck-info">
                  <div class="deck-title">${d.title || d.file}</div>
                  <div class="deck-meta">${date}${d.theme ? ' · ' + d.theme : ''}</div>
                </div>
              </div>`;
            }).join('');

            grid.querySelectorAll(".deck-card").forEach(card => {
              card.addEventListener("click", () => {
                const file = card.dataset.file;
                const instance = file.replace(/\.md$/i, '');
                openDeck(instance);
              });
            });
          }
        });
      }
    }

    function hideDeckPicker() {
      document.getElementById("deck-picker").classList.add("hidden");
    }

    document.getElementById("deck-close-btn").addEventListener("click", () => {
      if (deckLoaded) hideDeckPicker();
    });

    document.getElementById("props-toggle").addEventListener("click", () => {
      document.getElementById("props-panel").classList.toggle("hidden");
    });

    document.getElementById("deck-picker").addEventListener("click", (e) => {
      if (e.target === e.currentTarget && deckLoaded) hideDeckPicker();
    });

    async function openDeck(instance) {
      if (!slidesApp) return;
      // Use _use to switch instance, then load
      try {
        await slidesApp._use?.({ name: instance });
      } catch { /* _use may not exist as callable */ }
      const r = parseMCP(await slidesApp.main());
      handleData(r);
      deckLoaded = true;
      hideDeckPicker();
      document.getElementById("deck-name").textContent = instance;
    }

    document.getElementById("create-deck-btn").addEventListener("click", () => {
      const input = document.getElementById("new-deck-name");
      const name = input.value.trim();
      if (!name) return;
      openDeck(name);
      input.value = '';
    });

    document.getElementById("new-deck-name").addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("create-deck-btn").click();
    });

    // ── Bridge ──

    if (slidesApp) {
      window.photon?.onResult?.((result) => {
        handleData(parseMCP(result));
      });

      window.photon?.onEmit?.((event) => {
        const name = event?.event;
        if (name === "slideChanged" || name === "deckChanged") {
          slidesApp.main().then(r => handleData(parseMCP(r)));
        }
      });

      // Check if there's a loaded deck already (instance was set)
      slidesApp.main().then(r => {
        const data = parseMCP(r);
        if (data && data.html && data.html.trim()) {
          // Deck already loaded (instance was picked)
          handleData(data);
          deckLoaded = true;
          hideDeckPicker();
        } else {
          // No content — show deck picker
          showDeckPicker();
        }
      }).catch(() => {
        showDeckPicker();
      });
    }
  </script>
</body>
</html>
