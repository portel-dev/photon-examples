<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Docs</title>
  <style>
    :root {
      --bg: #0a0e1a;
      --surface: rgba(15, 20, 35, 0.95);
      --line: rgba(255,255,255,0.08);
      --text: #e5e5e5;
      --muted: rgba(255,255,255,0.4);
      --accent: #67c7ff;
      --page-bg: #ffffff;
      --page-text: #1a1a2e;
      --page-shadow: 0 2px 20px rgba(0,0,0,0.4);
      --spring: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { box-sizing: border-box; margin: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      height: 100vh;
      display: grid;
      grid-template-columns: 220px 1fr;
      grid-template-rows: auto 1fr;
      overflow: hidden;
    }

    /* ── Toolbar ── */

    .toolbar {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
      font-size: 13px;
      z-index: 100;
    }

    .toolbar .title {
      font-weight: 600;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toolbar .stats {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .toolbar .save-indicator {
      font-size: 11px;
      color: var(--muted);
      transition: opacity 0.3s;
    }
    .toolbar .save-indicator.saving { color: var(--accent); }
    .toolbar .save-indicator.saved { color: #4ade80; }

    .tb-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--line);
      color: var(--text);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      transition: background 0.15s;
      white-space: nowrap;
    }

    .tb-btn:hover { background: rgba(255,255,255,0.12); }
    .tb-btn.primary { background: rgba(103,199,255,0.15); border-color: rgba(103,199,255,0.3); color: var(--accent); }
    .tb-btn.primary:hover { background: rgba(103,199,255,0.25); }

    .tb-sep { width: 1px; height: 20px; background: var(--line); flex-shrink: 0; }

    /* ── Sidebar ── */

    .sidebar {
      background: var(--surface);
      border-right: 1px solid var(--line);
      padding: 16px 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .sidebar-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin-bottom: 4px;
      padding: 0 6px;
    }

    .outline-item {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      color: var(--text);
      padding: 5px 8px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.15s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .outline-item:hover { background: rgba(255,255,255,0.06); }
    .outline-item.active { background: rgba(103,199,255,0.12); color: var(--accent); }
    .outline-item.h2 { padding-left: 20px; font-size: 12px; }
    .outline-item.h3 { padding-left: 34px; font-size: 11px; color: var(--muted); }

    .doc-list {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .doc-item {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      color: var(--muted);
      padding: 5px 8px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.15s;
    }

    .doc-item:hover { background: rgba(255,255,255,0.06); color: var(--text); }
    .doc-item.active { background: rgba(103,199,255,0.1); color: var(--accent); }

    /* ── Main Preview Area ── */

    .preview-area {
      overflow-y: auto;
      background: #141828;
      padding: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .page {
      width: 210mm;
      max-width: 100%;
      min-height: 200px;
      background: var(--page-bg);
      color: var(--page-text);
      box-shadow: var(--page-shadow);
      border-radius: 4px;
      padding: 60px 56px;
      font-family: 'Inter', 'Georgia', serif;
      font-size: 11pt;
      line-height: 1.7;
      animation: page-in 0.25s ease-out both;
    }

    @keyframes page-in {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ── Page Typography ── */

    .page h1 { font-size: 2em; margin: 0 0 0.5em; color: #111; font-weight: 700; }
    .page h2 { font-size: 1.5em; margin: 1.2em 0 0.4em; color: #222; font-weight: 600; border-bottom: 1px solid #e5e5e5; padding-bottom: 0.3em; }
    .page h3 { font-size: 1.2em; margin: 1em 0 0.3em; color: #333; }
    .page p { margin: 0.6em 0; }
    .page ul, .page ol { margin: 0.6em 0; padding-left: 1.8em; }
    .page li { margin: 0.3em 0; }
    .page code { background: #f0f0f0; padding: 2px 6px; border-radius: 3px; font-size: 0.9em; font-family: 'JetBrains Mono', monospace; }
    .page pre { background: #f5f5f5; padding: 16px; border-radius: 6px; overflow-x: auto; margin: 0.8em 0; }
    .page pre code { background: none; padding: 0; }
    .page blockquote { border-left: 3px solid #ccc; padding-left: 16px; margin: 0.8em 0; color: #555; }
    .page img { max-width: 100%; border-radius: 4px; }
    .page table { border-collapse: collapse; width: 100%; margin: 0.8em 0; }
    .page th, .page td { border: 1px solid #ddd; padding: 8px 12px; text-align: left; }
    .page th { background: #f8f8f8; font-weight: 600; }
    .page hr { border: none; border-top: 1px solid #e5e5e5; margin: 2em 0; }

    .page .callout { padding: 16px 20px; border-radius: 6px; margin: 1em 0; border-left: 4px solid; }
    .page .callout-note { background: #eff6ff; border-color: #3b82f6; }
    .page .callout-warning { background: #fffbeb; border-color: #f59e0b; }
    .page .callout-tip { background: #f0fdf4; border-color: #22c55e; }
    .page .callout-title { font-weight: 600; margin-bottom: 4px; }
    .page .footnote { font-size: 0.85em; color: #666; border-top: 1px solid #e5e5e5; padding-top: 8px; margin-top: 2em; }

    .page-break-indicator {
      width: 100%;
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      padding: 4px 0;
    }

    /* ── Inline Editing ── */

    .editable-block {
      position: relative;
      cursor: text;
      border-radius: 4px;
      transition: outline-color 0.15s, background 0.15s;
      outline: 2px solid transparent;
      outline-offset: 4px;
    }

    .editable-block:hover {
      outline-color: rgba(103, 199, 255, 0.2);
      background: rgba(103, 199, 255, 0.03);
    }

    .editable-block.editing {
      outline-color: rgba(103, 199, 255, 0.5);
      background: rgba(103, 199, 255, 0.04);
    }

    .inline-editor {
      width: 100%;
      border: none;
      outline: none;
      resize: none;
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 13px;
      line-height: 1.7;
      color: var(--page-text);
      background: rgba(240, 245, 255, 0.6);
      padding: 8px 10px;
      border-radius: 4px;
      margin: 4px 0;
      min-height: 2.4em;
      overflow: hidden;
    }

    /* ── Source Mode Toggle ── */

    .source-editor {
      display: none;
      width: 210mm;
      max-width: 100%;
      min-height: 400px;
      background: rgba(10, 14, 26, 0.95);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 24px;
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 13px;
      line-height: 1.7;
      resize: vertical;
      outline: none;
    }

    .source-editor.visible { display: block; }

    /* ── Doc Picker Overlay ── */

    .picker-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 500;
    }

    .picker-overlay.visible { display: flex; }

    .picker {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      width: 480px;
      max-height: 70vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: picker-in 0.2s var(--spring) both;
    }

    @keyframes picker-in {
      from { opacity: 0; transform: scale(0.96) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .picker-header {
      padding: 20px 24px 16px;
      border-bottom: 1px solid var(--line);
    }

    .picker-header h2 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .picker-search {
      width: 100%;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--line);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }

    .picker-search:focus { border-color: rgba(103,199,255,0.4); }
    .picker-search::placeholder { color: var(--muted); }

    .picker-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .picker-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.12s;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      color: var(--text);
    }

    .picker-item:hover { background: rgba(255,255,255,0.06); }

    .picker-item .icon {
      width: 36px;
      height: 36px;
      background: rgba(103,199,255,0.1);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .picker-item .info { flex: 1; min-width: 0; }
    .picker-item .info .name { font-size: 13px; font-weight: 500; }
    .picker-item .info .meta { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .picker-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--line);
      display: flex;
      gap: 8px;
    }

    .picker-footer input {
      flex: 1;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--line);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }

    .picker-footer input::placeholder { color: var(--muted); }

    /* ── Find Bar ── */

    .find-bar {
      display: none;
      grid-column: 1 / -1;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      font-size: 13px;
      z-index: 99;
    }
    .find-bar.visible { display: flex; }
    .find-bar input {
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--line);
      color: var(--text);
      padding: 5px 10px;
      border-radius: 5px;
      font-size: 13px;
      outline: none;
    }
    .find-bar input:focus { border-color: rgba(103,199,255,0.4); }
    .find-bar input::placeholder { color: var(--muted); }
    .find-bar .find-count { color: var(--muted); font-size: 12px; white-space: nowrap; min-width: 70px; }
    .find-bar .replace-group { display: none; align-items: center; gap: 6px; }
    .find-bar .replace-group.visible { display: flex; }

    .find-highlight { background: rgba(255, 230, 0, 0.45); border-radius: 2px; }
    .find-highlight.current { background: rgba(255, 150, 0, 0.65); }

    @media (max-width: 900px) {
      body { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .page { padding: 32px 24px; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <button class="tb-btn" id="docs-btn">Docs</button>
    <span class="tb-sep"></span>
    <span class="title" id="doc-title">Untitled Document</span>
    <span class="save-indicator" id="save-indicator"></span>
    <span class="stats" id="doc-stats"></span>
    <span class="tb-sep"></span>
    <button class="tb-btn" id="find-btn">Find</button>
    <button class="tb-btn" id="source-btn">Source</button>
    <button class="tb-btn primary" id="save-btn">Save</button>
  </div>

  <div class="find-bar" id="find-bar">
    <input type="text" id="find-input" placeholder="Find..." style="width:200px;">
    <span class="find-count" id="find-count"></span>
    <button class="tb-btn" id="find-next-btn">Next</button>
    <button class="tb-btn" id="find-prev-btn">Prev</button>
    <button class="tb-btn" id="toggle-replace-btn">Replace</button>
    <div class="replace-group" id="replace-group">
      <input type="text" id="replace-input" placeholder="Replace with..." style="width:200px;">
      <button class="tb-btn" id="replace-btn">Replace</button>
      <button class="tb-btn" id="replace-all-btn">Replace All</button>
    </div>
    <button class="tb-btn" id="find-close-btn" style="margin-left:auto;">Close</button>
  </div>

  <aside class="sidebar">
    <div class="sidebar-label">Outline</div>
    <div id="outline"></div>
    <div class="sidebar-label" style="margin-top:16px;">Documents</div>
    <div class="doc-list" id="doc-list"></div>
  </aside>

  <div class="preview-area" id="preview-area">
    <div id="preview"></div>
    <textarea class="source-editor" id="source-editor" spellcheck="false"></textarea>
  </div>

  <!-- Document Picker Overlay -->
  <div class="picker-overlay" id="picker-overlay">
    <div class="picker">
      <div class="picker-header">
        <h2>Open Document</h2>
        <input class="picker-search" id="picker-search" placeholder="Search documents..." autocomplete="off">
      </div>
      <div class="picker-list" id="picker-list"></div>
      <div class="picker-footer">
        <input id="new-doc-name" placeholder="New document name...">
        <button class="tb-btn primary" id="new-doc-btn">Create</button>
      </div>
    </div>
  </div>

  <script>
    const docsApp = window["docs"];
    let state = { markdown: '', frontmatter: {}, outline: [], stats: {} };
    let currentFile = '';
    let sourceMode = false;
    let editingBlock = null;
    let saveTimeout = null;
    let docList = [];

    // ── MCP Helpers ──

    function parseMCP(raw) {
      if (raw && raw.content && Array.isArray(raw.content)) {
        const item = raw.content.find(c => c.type === "text" && c.text);
        if (item) { try { return JSON.parse(item.text); } catch { return item.text; } }
      }
      return raw;
    }

    // ── Markdown Parsing ──

    function splitFrontmatter(md) {
      const match = md.match(/^---\n[\s\S]*?\n---\n?/);
      return { frontmatter: match ? match[0] : '', body: match ? md.slice(match[0].length) : md };
    }

    /**
     * Parse body into blocks: each block is { type, raw, level? }
     * Types: heading, paragraph, code, callout, list, blockquote, hr, pagebreak
     */
    function parseBlocks(body) {
      const lines = body.split('\n');
      const blocks = [];
      let i = 0;

      while (i < lines.length) {
        const line = lines[i];

        // Empty lines — skip
        if (line.trim() === '') { i++; continue; }

        // Page break
        if (line.trim() === '---pagebreak---') {
          blocks.push({ type: 'pagebreak', raw: line });
          i++; continue;
        }

        // HR
        if (/^---$/.test(line.trim()) && (i === 0 || lines[i-1].trim() === '')) {
          blocks.push({ type: 'hr', raw: line });
          i++; continue;
        }

        // Code block
        if (line.startsWith('```')) {
          let raw = line + '\n';
          i++;
          while (i < lines.length && !lines[i].startsWith('```')) {
            raw += lines[i] + '\n';
            i++;
          }
          if (i < lines.length) { raw += lines[i]; i++; }
          blocks.push({ type: 'code', raw: raw.trimEnd() });
          continue;
        }

        // Callout container
        if (line.startsWith('::: ')) {
          let raw = line + '\n';
          i++;
          while (i < lines.length && lines[i].trim() !== ':::') {
            raw += lines[i] + '\n';
            i++;
          }
          if (i < lines.length) { raw += lines[i]; i++; }
          blocks.push({ type: 'callout', raw: raw.trimEnd() });
          continue;
        }

        // Heading
        const hMatch = line.match(/^(#{1,6})\s+(.+)/);
        if (hMatch) {
          blocks.push({ type: 'heading', raw: line, level: hMatch[1].length, text: hMatch[2] });
          i++; continue;
        }

        // Blockquote (collect consecutive)
        if (line.startsWith('> ')) {
          let raw = '';
          while (i < lines.length && lines[i].startsWith('> ')) {
            raw += lines[i] + '\n';
            i++;
          }
          blocks.push({ type: 'blockquote', raw: raw.trimEnd() });
          continue;
        }

        // List items (collect consecutive - or 1.)
        if (/^[-*]\s/.test(line) || /^\d+\.\s/.test(line)) {
          let raw = '';
          while (i < lines.length && (/^[-*]\s/.test(lines[i]) || /^\d+\.\s/.test(lines[i]) || /^\s+/.test(lines[i]))) {
            raw += lines[i] + '\n';
            i++;
          }
          blocks.push({ type: 'list', raw: raw.trimEnd() });
          continue;
        }

        // Paragraph (collect until blank line or structural element)
        {
          let raw = '';
          while (i < lines.length && lines[i].trim() !== '' &&
            !lines[i].startsWith('#') && !lines[i].startsWith('```') &&
            !lines[i].startsWith('::: ') && !lines[i].startsWith('> ') &&
            !/^[-*]\s/.test(lines[i]) && !/^\d+\.\s/.test(lines[i]) &&
            lines[i].trim() !== '---pagebreak---' && !/^---$/.test(lines[i].trim())) {
            raw += lines[i] + '\n';
            i++;
          }
          if (raw.trim()) blocks.push({ type: 'paragraph', raw: raw.trimEnd() });
        }
      }
      return blocks;
    }

    // ── Markdown → HTML Renderers ──

    function renderInline(text) {
      return text
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.+?)\*/g, '<em>$1</em>')
        .replace(/`(.+?)`/g, '<code>$1</code>')
        .replace(/\[(.+?)\]\((.+?)\)/g, '<a href="$2">$1</a>')
        .replace(/\[\^(\d+)\]/g, '<sup>$1</sup>');
    }

    function blockToHTML(block) {
      switch (block.type) {
        case 'heading':
          return `<h${block.level}>${renderInline(block.text)}</h${block.level}>`;
        case 'paragraph':
          return `<p>${renderInline(block.raw)}</p>`;
        case 'code': {
          const m = block.raw.match(/^```(\w*)\n([\s\S]*?)```?$/);
          const code = m ? m[2] : block.raw;
          return `<pre><code>${escapeHTML(code)}</code></pre>`;
        }
        case 'callout': {
          const m = block.raw.match(/^::: (\w+)\n([\s\S]*?):::?$/);
          if (m) {
            const type = m[1];
            return `<div class="callout callout-${type}"><div class="callout-title">${type.charAt(0).toUpperCase() + type.slice(1)}</div><p>${renderInline(m[2].trim())}</p></div>`;
          }
          return `<p>${renderInline(block.raw)}</p>`;
        }
        case 'blockquote': {
          const content = block.raw.split('\n').map(l => l.replace(/^>\s?/, '')).join('<br>');
          return `<blockquote>${renderInline(content)}</blockquote>`;
        }
        case 'list': {
          const items = block.raw.split('\n').filter(l => l.trim());
          const ordered = /^\d+\./.test(items[0]);
          const tag = ordered ? 'ol' : 'ul';
          const lis = items.map(l => `<li>${renderInline(l.replace(/^[-*]\s|^\d+\.\s/, ''))}</li>`).join('');
          return `<${tag}>${lis}</${tag}>`;
        }
        case 'hr': return '<hr>';
        case 'pagebreak': return '';
        default: return `<p>${renderInline(block.raw)}</p>`;
      }
    }

    function escapeHTML(text) {
      return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // ── Render Preview with Editable Blocks ──

    function renderPreview(markdown) {
      const preview = document.getElementById("preview");
      const { body } = splitFrontmatter(markdown);
      const pages = body.split(/---pagebreak---/);

      let blockIndex = 0;
      const allBlocks = parseBlocks(body);

      preview.innerHTML = pages.map((pageContent, pageIdx) => {
        const blocks = parseBlocks(pageContent.trim());
        const pageHTML = blocks.map(block => {
          const html = blockToHTML(block);
          const idx = blockIndex++;
          if (block.type === 'pagebreak') return '';
          return `<div class="editable-block" data-block="${idx}" data-type="${block.type}" title="Click to edit">${html}</div>`;
        }).join('');
        return `<div class="page">${pageHTML}</div>` +
          (pageIdx < pages.length - 1 ? '<div class="page-break-indicator">--- page break ---</div>' : '');
      }).join('');

      // Store blocks for editing
      preview._blocks = allBlocks;

      // Attach click handlers
      preview.querySelectorAll('.editable-block').forEach(el => {
        el.addEventListener('click', () => startInlineEdit(el));
      });
    }

    // ── Inline Editing ──

    function startInlineEdit(el) {
      if (sourceMode) return;
      if (editingBlock === el) return;

      // Close any existing edit
      finishInlineEdit();

      const preview = document.getElementById("preview");
      const idx = parseInt(el.dataset.block);
      const block = preview._blocks[idx];
      if (!block) return;

      editingBlock = el;
      el.classList.add('editing');

      const textarea = document.createElement('textarea');
      textarea.className = 'inline-editor';
      textarea.value = block.raw;

      // Auto-size
      function autoSize() {
        textarea.style.height = 'auto';
        textarea.style.height = textarea.scrollHeight + 'px';
      }

      textarea.addEventListener('input', () => {
        autoSize();
        // Update block raw and schedule save
        block.raw = textarea.value;
        // Update heading text if heading
        if (block.type === 'heading') {
          const m = textarea.value.match(/^(#{1,6})\s+(.+)/);
          if (m) { block.level = m[1].length; block.text = m[2]; }
        }
        scheduleAutoSave();
      });

      textarea.addEventListener('keydown', (e) => {
        // Escape to cancel
        if (e.key === 'Escape') {
          finishInlineEdit();
          e.preventDefault();
        }
        // Ctrl/Cmd+Enter to finish
        if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) {
          finishInlineEdit();
          e.preventDefault();
        }
      });

      // Replace content with textarea
      el._originalHTML = el.innerHTML;
      el.innerHTML = '';
      el.appendChild(textarea);
      textarea.focus();
      autoSize();
    }

    function finishInlineEdit() {
      if (!editingBlock) return;
      const el = editingBlock;
      const preview = document.getElementById("preview");
      const idx = parseInt(el.dataset.block);
      const block = preview._blocks[idx];
      editingBlock = null;

      el.classList.remove('editing');

      if (block) {
        // Re-render this block
        el.innerHTML = blockToHTML(block);

        // Use section editing via edit() if we can identify the section heading
        const headingText = findSectionHeading(idx);
        if (headingText && docsApp) {
          const sectionMd = collectSectionMarkdown(headingText);
          docsApp.edit({ section: headingText, markdown: sectionMd }).then(r => {
            const data = parseMCP(r);
            if (data && data.markdown) {
              state = data;
              updateTitle(data);
              renderOutline(data.outline);
              refreshStats();
            }
          }).catch(() => {
            // Fallback: full save
            scheduleAutoSave();
          });
          // Re-attach click handler and return (edit() handles save)
          el.addEventListener('click', () => startInlineEdit(el));
          return;
        }
      } else if (el._originalHTML) {
        el.innerHTML = el._originalHTML;
      }

      // Re-attach click handler
      el.addEventListener('click', () => startInlineEdit(el));
    }

    function rebuildMarkdown() {
      const preview = document.getElementById("preview");
      const blocks = preview._blocks;
      if (!blocks) return state.markdown;

      const { frontmatter } = splitFrontmatter(state.markdown);
      const body = blocks.map(b => b.raw).join('\n\n');
      return frontmatter + body + '\n';
    }

    // ── Auto-Save ──

    function scheduleAutoSave() {
      const indicator = document.getElementById("save-indicator");
      indicator.textContent = 'Unsaved changes';
      indicator.className = 'save-indicator';

      clearTimeout(saveTimeout);
      saveTimeout = setTimeout(async () => {
        const markdown = sourceMode
          ? document.getElementById("source-editor").value
          : rebuildMarkdown();
        await doSave(markdown);
        refreshStats();
      }, 1500);
    }

    async function doSave(markdown) {
      if (!docsApp) return;
      const indicator = document.getElementById("save-indicator");
      indicator.textContent = 'Saving...';
      indicator.className = 'save-indicator saving';

      try {
        const result = parseMCP(await docsApp.save({ markdown }));
        if (result && !result.error) {
          state = result;
          updateTitle(result);
          updateStats(result);
          renderOutline(result.outline);
          indicator.textContent = 'Saved';
          indicator.className = 'save-indicator saved';
          setTimeout(() => { indicator.textContent = ''; }, 2000);
        }
      } catch (e) {
        indicator.textContent = 'Save failed';
        indicator.className = 'save-indicator';
      }
    }

    // ── Source Mode ──

    function toggleSourceMode() {
      sourceMode = !sourceMode;
      const srcEditor = document.getElementById("source-editor");
      const preview = document.getElementById("preview");
      const btn = document.getElementById("source-btn");

      finishInlineEdit();

      if (sourceMode) {
        srcEditor.value = state.markdown;
        srcEditor.classList.add('visible');
        preview.style.display = 'none';
        btn.textContent = 'Preview';
        btn.classList.add('primary');
      } else {
        // Apply source changes
        const newMd = srcEditor.value;
        if (newMd !== state.markdown) {
          state.markdown = newMd;
          renderPreview(newMd);
          scheduleAutoSave();
        }
        srcEditor.classList.remove('visible');
        preview.style.display = '';
        btn.textContent = 'Source';
        btn.classList.remove('primary');
      }
    }

    // ── UI Updates ──

    function updateTitle(data) {
      const fm = data.frontmatter || {};
      document.getElementById("doc-title").textContent = fm.title || data.file || 'Untitled';
    }

    function updateStats(data) {
      const s = data.stats || {};
      document.getElementById("doc-stats").textContent =
        `${s.words || 0} words · ${s.readingTime || 1} min · ${s.headings || 0} sections`;
    }

    function renderOutline(outline) {
      const el = document.getElementById("outline");
      if (!outline || !outline.length) {
        el.innerHTML = '<span style="color:var(--muted);font-size:12px;">No headings</span>';
        return;
      }
      el.innerHTML = outline.map(h =>
        `<button class="outline-item h${h.level}" data-text="${escapeHTML(h.text)}">${h.text}</button>`
      ).join('');

      el.querySelectorAll('.outline-item').forEach(btn => {
        btn.addEventListener('click', () => {
          const text = btn.dataset.text;
          // Find the editable block with this heading
          const blocks = document.querySelectorAll('.editable-block[data-type="heading"]');
          for (const block of blocks) {
            if (block.textContent.trim() === text) {
              block.scrollIntoView({ behavior: 'smooth', block: 'center' });
              block.style.outline = '2px solid var(--accent)';
              setTimeout(() => { block.style.outline = ''; }, 1500);
              break;
            }
          }
        });
      });
    }

    function updateUI(data) {
      if (!data || data.error) return;
      state = data;
      currentFile = data.file || '';
      updateTitle(data);
      updateStats(data);
      renderOutline(data.outline);
      renderPreview(data.markdown || '');
      // Highlight active doc in sidebar
      document.querySelectorAll('.doc-item').forEach(el => {
        el.classList.toggle('active', el.dataset.file === currentFile);
      });
    }

    // ── Document Picker ──

    function showPicker() {
      const overlay = document.getElementById("picker-overlay");
      overlay.classList.add('visible');
      renderPickerList('');
      document.getElementById("picker-search").value = '';
      document.getElementById("picker-search").focus();
    }

    function hidePicker() {
      document.getElementById("picker-overlay").classList.remove('visible');
    }

    function renderPickerList(query) {
      const list = document.getElementById("picker-list");
      const q = query.toLowerCase();
      const filtered = docList.filter(d =>
        !q || d.title.toLowerCase().includes(q) || d.file.toLowerCase().includes(q)
      );

      list.innerHTML = filtered.map(d => `
        <button class="picker-item" data-file="${d.file}">
          <div class="icon">${d.file === currentFile ? '📝' : '📄'}</div>
          <div class="info">
            <div class="name">${d.title || d.file}</div>
            <div class="meta">${d.wordCount} words · ${timeAgo(d.updatedAt)}</div>
          </div>
        </button>
      `).join('') || '<div style="padding:20px;text-align:center;color:var(--muted);">No documents found</div>';

      list.querySelectorAll('.picker-item').forEach(el => {
        el.addEventListener('click', () => openDoc(el.dataset.file));
      });
    }

    function timeAgo(iso) {
      if (!iso) return '';
      const diff = Date.now() - new Date(iso).getTime();
      const mins = Math.floor(diff / 60000);
      if (mins < 1) return 'just now';
      if (mins < 60) return `${mins}m ago`;
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return `${hrs}h ago`;
      const days = Math.floor(hrs / 24);
      return `${days}d ago`;
    }

    async function openDoc(file) {
      hidePicker();
      if (!docsApp) return;
      if (window.photon?.switchInstance) {
        await window.photon.switchInstance(file.replace(/\.md$/i, ''));
      }
      const result = parseMCP(await docsApp.main());
      updateUI(result);
      await loadDocList();
      refreshStats();
    }

    async function createDoc(name) {
      if (!name.trim()) return;
      hidePicker();
      const fileName = name.trim().replace(/\.md$/i, '') + '.md';
      if (window.photon?.switchInstance) {
        await window.photon.switchInstance(name.trim().replace(/\.md$/i, ''));
        const result = parseMCP(await docsApp.main());
        updateUI(result);
        await loadDocList();
      }
    }

    async function loadDocList() {
      if (!docsApp) return;
      try {
        const data = parseMCP(await docsApp.list());
        if (data && data.docs) {
          docList = data.docs;
          // Update sidebar
          const list = document.getElementById("doc-list");
          list.innerHTML = data.docs.map(d =>
            `<button class="doc-item${d.file === currentFile ? ' active' : ''}" data-file="${d.file}">${d.title || d.file}</button>`
          ).join('');
          list.querySelectorAll('.doc-item').forEach(el => {
            el.addEventListener('click', () => openDoc(el.dataset.file));
          });
        }
      } catch (e) { /* ignore */ }
    }

    // ── Find Bar ──

    let findMatches = [];
    let findCurrentIdx = -1;

    function showFindBar() {
      document.getElementById("find-bar").classList.add('visible');
      document.getElementById("find-input").focus();
    }

    function hideFindBar() {
      document.getElementById("find-bar").classList.remove('visible');
      document.getElementById("replace-group").classList.remove('visible');
      clearFindHighlights();
      findMatches = [];
      findCurrentIdx = -1;
      document.getElementById("find-count").textContent = '';
    }

    function clearFindHighlights() {
      document.querySelectorAll('.find-highlight').forEach(el => {
        const parent = el.parentNode;
        parent.replaceChild(document.createTextNode(el.textContent), el);
        parent.normalize();
      });
    }

    async function doFind(query) {
      clearFindHighlights();
      findMatches = [];
      findCurrentIdx = -1;
      const countEl = document.getElementById("find-count");

      if (!query) { countEl.textContent = ''; return; }

      // Call backend find for validation
      if (docsApp) {
        try { parseMCP(await docsApp.find({ query })); } catch {}
      }

      // Highlight in preview DOM
      const preview = document.getElementById("preview");
      const walker = document.createTreeWalker(preview, NodeFilter.SHOW_TEXT, null);
      const textNodes = [];
      while (walker.nextNode()) textNodes.push(walker.currentNode);

      const queryLower = query.toLowerCase();
      for (const node of textNodes) {
        const text = node.textContent;
        const idx = text.toLowerCase().indexOf(queryLower);
        if (idx === -1) continue;

        const before = text.substring(0, idx);
        const match = text.substring(idx, idx + query.length);
        const after = text.substring(idx + query.length);

        const span = document.createElement('span');
        span.className = 'find-highlight';
        span.textContent = match;

        const parent = node.parentNode;
        if (before) parent.insertBefore(document.createTextNode(before), node);
        parent.insertBefore(span, node);
        if (after) parent.insertBefore(document.createTextNode(after), node);
        parent.removeChild(node);

        findMatches.push(span);
      }

      countEl.textContent = findMatches.length ? `${findMatches.length} found` : 'No results';
      if (findMatches.length) navigateFind(0);
    }

    function navigateFind(idx) {
      if (!findMatches.length) return;
      if (findCurrentIdx >= 0 && findCurrentIdx < findMatches.length) {
        findMatches[findCurrentIdx].classList.remove('current');
      }
      findCurrentIdx = ((idx % findMatches.length) + findMatches.length) % findMatches.length;
      findMatches[findCurrentIdx].classList.add('current');
      findMatches[findCurrentIdx].scrollIntoView({ behavior: 'smooth', block: 'center' });
      document.getElementById("find-count").textContent = `${findCurrentIdx + 1} of ${findMatches.length}`;
    }

    async function doReplace(all) {
      const pattern = document.getElementById("find-input").value;
      const replacement = document.getElementById("replace-input").value;
      if (!pattern || !docsApp) return;

      try {
        const result = parseMCP(await docsApp.replace({ pattern, replacement, all: !!all }));
        if (result && result.markdown) {
          updateUI(result);
          // Re-run find to update highlights
          await doFind(all ? '' : pattern);
        }
      } catch {}
    }

    // ── Stats Refresh ──

    async function refreshStats() {
      if (!docsApp) return;
      try {
        const data = parseMCP(await docsApp.stats());
        if (data && !data.error) {
          const el = document.getElementById("doc-stats");
          el.textContent = `${data.words || 0} words · ${data.readingTime || 1} min · ${data.headings || data.sections || 0} sections`;
        }
      } catch {}
    }

    // ── Section Editing via edit() ──

    function findSectionHeading(blockIdx) {
      const preview = document.getElementById("preview");
      const blocks = preview._blocks;
      if (!blocks) return null;
      // Walk backwards from blockIdx to find the nearest heading
      for (let i = blockIdx; i >= 0; i--) {
        if (blocks[i].type === 'heading') return blocks[i].text;
      }
      return null;
    }

    function collectSectionMarkdown(headingText) {
      const preview = document.getElementById("preview");
      const blocks = preview._blocks;
      if (!blocks) return '';
      let collecting = false;
      let headingLevel = 0;
      const parts = [];
      for (const b of blocks) {
        if (b.type === 'heading' && b.text === headingText) {
          collecting = true;
          headingLevel = b.level;
          parts.push(b.raw);
          continue;
        }
        if (collecting) {
          if (b.type === 'heading' && b.level <= headingLevel) break;
          parts.push(b.raw);
        }
      }
      return parts.join('\n\n');
    }

    // ── Event Handlers ──

    document.getElementById("save-btn").addEventListener("click", async () => {
      finishInlineEdit();
      const markdown = sourceMode
        ? document.getElementById("source-editor").value
        : rebuildMarkdown();
      await doSave(markdown);
      refreshStats();
    });

    document.getElementById("source-btn").addEventListener("click", toggleSourceMode);
    document.getElementById("docs-btn").addEventListener("click", showPicker);
    document.getElementById("find-btn").addEventListener("click", showFindBar);
    document.getElementById("find-close-btn").addEventListener("click", hideFindBar);

    document.getElementById("find-input").addEventListener("input", (e) => {
      doFind(e.target.value);
    });
    document.getElementById("find-next-btn").addEventListener("click", () => {
      navigateFind(findCurrentIdx + 1);
    });
    document.getElementById("find-prev-btn").addEventListener("click", () => {
      navigateFind(findCurrentIdx - 1);
    });
    document.getElementById("toggle-replace-btn").addEventListener("click", () => {
      document.getElementById("replace-group").classList.toggle('visible');
      document.getElementById("replace-input").focus();
    });
    document.getElementById("replace-btn").addEventListener("click", () => doReplace(false));
    document.getElementById("replace-all-btn").addEventListener("click", () => doReplace(true));

    // Source editor auto-save
    document.getElementById("source-editor").addEventListener("input", () => {
      scheduleAutoSave();
    });

    // Keyboard shortcuts
    document.addEventListener("keydown", (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === "s") {
        e.preventDefault();
        document.getElementById("save-btn").click();
      }
      if ((e.metaKey || e.ctrlKey) && e.key === "f") {
        e.preventDefault();
        showFindBar();
      }
      if (e.key === 'Escape') {
        if (document.getElementById("find-bar").classList.contains('visible')) {
          hideFindBar();
        } else if (document.getElementById("picker-overlay").classList.contains('visible')) {
          hidePicker();
        }
      }
    });

    // Click outside editable block to finish editing
    document.getElementById("preview-area").addEventListener("click", (e) => {
      if (editingBlock && !editingBlock.contains(e.target)) {
        finishInlineEdit();
      }
    });

    // Picker search
    document.getElementById("picker-search").addEventListener("input", (e) => {
      renderPickerList(e.target.value);
    });

    // Picker overlay click to close
    document.getElementById("picker-overlay").addEventListener("click", (e) => {
      if (e.target === e.currentTarget) hidePicker();
    });

    // New doc
    document.getElementById("new-doc-btn").addEventListener("click", () => {
      createDoc(document.getElementById("new-doc-name").value);
    });
    document.getElementById("new-doc-name").addEventListener("keydown", (e) => {
      if (e.key === 'Enter') createDoc(e.target.value);
    });

    // ── Bridge & Init ──

    if (docsApp) {
      window.photon?.onResult?.((result) => {
        const data = parseMCP(result);
        if (data && data.markdown) updateUI(data);
      });

      window.photon?.onEmit?.((event) => {
        if (event?.event === "docChanged") {
          docsApp.main().then(r => updateUI(parseMCP(r)));
        }
      });

      // Initial load
      docsApp.main().then(r => {
        updateUI(parseMCP(r));
        loadDocList();
        refreshStats();
      });

      // Periodic stats refresh (every 30s)
      setInterval(refreshStats, 30000);
    }
  </script>
</body>
</html>
